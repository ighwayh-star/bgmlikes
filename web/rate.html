<style>
  :root {

    --text: #4a3f4e; --sub: #b39aa8;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--text);
    font-family: "SimHei","Heiti SC","Microsoft YaHei","PingFang SC",sans-serif;
    min-height: 100vh;
  }
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; top: -8vh; left: 0;
    width: var(--size, 14px); height: var(--size, 14px);
    background: radial-gradient(circle at 32% 32%, #ffe3f0, #ffb3d1 55%, #ff8fb8);
    border-radius: 78% 22% 76% 24% / 62% 40% 60% 38%;
    opacity: 0;
    box-shadow: 0 0 6px rgba(242,109,157,.15);
    animation: petal-fall var(--dur, 10s) linear var(--delay, 0s) infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate3d(0, -6vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .9; }
    25%  { transform: translate3d(26px, 24vh, 0) rotate(96deg); opacity: .9; }
    50%  { transform: translate3d(-20px, 50vh, 0) rotate(190deg); opacity: .85; }
    75%  { transform: translate3d(24px, 76vh, 0) rotate(286deg); opacity: .7; }
    100% { transform: translate3d(-12px, 108vh, 0) rotate(360deg); opacity: 0; }
  }

  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 34px 20px 80px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand-link {
    font-size: 26px; font-weight: 700; color: #e85f8d; letter-spacing: 1px; text-decoration: none;
    text-shadow: 0 0 18px rgba(242,109,157,.35), 0 0 34px rgba(255,179,209,.35);
  }
  .brand-link:hover { text-shadow: 0 0 22px rgba(242,109,157,.5), 0 0 40px rgba(255,179,209,.5); }
  .nav-link { font-size: 13px; color: var(--sub); text-decoration: none; }
  .nav-link:hover { color: var(--accent); }
  .nav-link.active { color: var(--accent); font-weight: 600; }
  .gh-link { color: var(--sub); display: inline-flex; align-items: center; text-decoration: none; transition: color .2s; }
  .gh-link:hover { color: var(--accent); }
  .autharea { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  button { padding: 9px 16px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent)); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(242,109,157,.28);
    transition: transform .18s, box-shadow .18s; font-family: inherit; }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(242,109,157,.4); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.sec { background: rgba(255,255,255,.75); border: 1px solid rgba(242,109,157,.28); color: var(--accent); box-shadow: none; }
  #userlabel { color: var(--sub); font-size: 13px; }

  .searchbar { margin-bottom: 14px; }
  .searchbar input {
    width: 100%; padding: 12px 18px; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.25); background: rgba(255,255,255,.85);
    font-size: 15px; color: var(--text); outline: none; font-family: inherit;

  .searchbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(242,109,157,.15); }

  .meta { color: var(--sub); font-size: 14px; margin-bottom: 12px; min-height: 20px; }
  .err { color: #e85f8d; font-size: 14px; margin-bottom: 12px; }
  .login-hint { font-size: 13px; color: var(--sub); margin-bottom: 12px; text-align: center; }
  .login-hint a { color: var(--accent); }

  .card {
    display: flex; align-items: stretch; gap: 14px;
    background: var(--card); border: 1px solid rgba(255,255,255,.65);
    border-radius: 16px; padding: 12px 16px; margin-bottom: 10px;

  .name-ja { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .meta-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .rating { font-size: 13px; font-weight: 700; color: #f5a623; background: rgba(245,166,35,.08);
    padding: 1px 6px; border-radius: 99px; }
  .date { font-size: 12px; color: var(--sub); }
  .nsfw-tag { font-size: 10px; font-weight: 700; color: #fff; background: #b76ae0; padding: 1px 6px; border-radius: 99px; }
  .state-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
  .state--watching { color: #e85f8d; background: rgba(232,95,141,.12); }
  .state--watched { color: #7c8fa6; background: rgba(124,143,166,.14); }
  .state--want { color: #4d96ff; background: rgba(77,150,255,.12); }
  .state--hold { color: #e8a87c; background: rgba(232,168,124,.16); }
  .state--dropped { color: #9aa0a6; background: rgba(154,160,166,.14); }

  /* 10 星控件（BGM 式）：悬浮第 k 颗高亮 1..k + 数字气泡，点击即打 */
  .stars { display: flex; align-items: center; gap: 2px; margin-top: 7px; min-height: 20px; flex-wrap: wrap; }
  .star { font-size: 17px; color: #e3c4d2; cursor: pointer; line-height: 1;
    transition: transform .12s, color .12s, text-shadow .12s; user-select: none; }
  .star:hover { transform: scale(1.25); }
  .star.on { color: #f5a623; text-shadow: 0 0 6px rgba(245,166,35,.45); }

  .link:hover { opacity: 1; transform: translateY(-1px); }
  .link .link-ico { width: 18px; height: 18px; border-radius: 4px; display: block; }
  .link .link-txt { display: none; }
  .link.no-ico .link-txt { display: inline; }
  .link-bgm { border-color: rgba(124,140,248,.32); }
  .link-bgm:hover { background: rgba(124,140,248,.12); }
  .link-bili { border-color: rgba(251,114,153,.32); }
  .link-bili:hover { background: rgba(251,114,153,.12); }

  /* 卡片浮窗：点击卡片 → 简介 + 相似动画 + 跳转（2026-08-19，对齐 /likes /daily） */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(74,63,78,.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  /* 必须双类：.modal-overlay 定义在 .hidden 之后，单类优先级 display:flex 会覆盖 display:none，
     导致浮窗始终可见、关不掉。双类 (0,2,0) 压过单类 (0,1,0)。 */
  .modal-overlay.hidden { display: none; }
  .modal {
    position: relative; z-index: 1001; width: min(560px, 100%); max-height: 82vh;
    overflow-y: auto; background: #fff; border-radius: 22px;
    box-shadow: 0 18px 50px rgba(74,63,78,.35); padding: 22px 20px 20px;
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px; width: 32px; height: 32px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(242,109,157,.22); background: rgba(255,255,255,.8);
    color: var(--sub); font-size: 15px; line-height: 1; cursor: pointer; box-shadow: none;
  }
  .modal-close:hover { color: var(--accent); border-color: rgba(242,109,157,.5); }
  .modal-head { display: flex; gap: 16px; }
  .modal-cover {
    width: 120px; height: 168px; object-fit: cover; border-radius: 12px;
    background: #ffe9f2; flex-shrink: 0; box-shadow: 0 2px 10px rgba(242,109,157,.2);
  }
  .modal-title { flex: 1; min-width: 0; font-size: 19px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .modal-rating { color: #e8a33d; font-weight: 700; font-size: 13px; margin-top: 4px; }
  .modal-date, .modal-sub { color: var(--sub); font-size: 13px; margin-top: 3px; }
  .modal-tag {
    display: inline-block; font-size: 11px; padding: 2px 8px; margin: 4px 4px 0 0;
    border-radius: 999px; background: rgba(242,109,157,.1); color: var(--accent);
    border: 1px solid rgba(242,109,157,.22);
  }
  .modal-info { flex: 1; min-width: 0; }
  .modal-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-right: 32px; /* 右侧留出关闭按钮区（✕ 绝对定位在 modal 右上角） */ }
  .modal-actions { display: flex; gap: 6px; flex-shrink: 0; margin-top: 2px; }
  .modal-link {
    display: inline-flex; align-items: center; justify-content: center;
    height: 30px; padding: 0 9px; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.22); background: rgba(255,255,255,.6);
    font-size: 12px; font-weight: 600; text-decoration: none;
    opacity: .8; transition: opacity .15s, transform .15s, background .15s;
  }
  .modal-link:hover { opacity: 1; transform: translateY(-1px); }
  .modal-link .mi-ico { width: 18px; height: 18px; border-radius: 4px; display: block; }
  .modal-link .mi-txt { display: none; }
  .modal-link.no-ico .mi-txt { display: inline; }
  .modal-link-bgm { border-color: rgba(124,140,248,.32); }
  .modal-link-bgm:hover { background: rgba(124,140,248,.12); }
  .modal-link-bili { border-color: rgba(251,114,153,.32); }
  .modal-link-bili:hover { background: rgba(251,114,153,.12); }
  .modal-section { font-size: 13px; color: var(--sub); font-weight: 700; margin: 16px 0 8px; }
  .modal-summary { font-family: "SimHei","Heiti SC","Microsoft YaHei","PingFang SC",sans-serif; font-size: 15px; line-height: 1.75; color: var(--text); white-space: pre-line; word-break: break-word; }
  .similar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .similar-item {
    display: flex; gap: 8px; align-items: center; padding: 8px;
    border: 1px solid rgba(242,109,157,.18); border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.7); transition: border-color .15s, background .15s;
  }
  .similar-item:hover { border-color: var(--accent-soft); background: rgba(255,255,255,.95); }
  .similar-item .sc { width: 38px; height: 52px; object-fit: cover; border-radius: 6px; background: #ffe9f2; flex-shrink: 0; }
  .similar-item .sc-name { font-size: 15px; overflow-wrap: anywhere; line-height: 1.3; }
  .similar-item .sc-rate { font-size: 13px; color: #e8a33d; font-weight: 700; margin-top: 2px; }
  .modal-empty { color: var(--sub); font-size: 13px; }
  .modal-rate-hint { font-size: 13px; color: var(--sub); margin-top: 8px; }
  .modal-rate-hint a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .modal-rate-hint a:hover { text-decoration: underline; }
  .stars.busy { opacity: .55; pointer-events: none; }

  .empty { text-align: center; color: var(--sub); padding: 28px 0; font-size: 15px; }
  .hidden { display: none; }
  .footer { padding: 10px 2px 16px; text-align: center; font-size: 13px; color: var(--sub); }
  .footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 480px) {
    .wrap { padding: 24px 14px 60px; }
    .brand-link { font-size: 22px; }
    .card { padding: 10px 12px; }
    .name-cn { font-size: 15px; }
    .star { font-size: 15px; }
    .link { padding: 2px 10px; }
    .modal-overlay { padding: 10px; }
    .modal { padding: 16px 14px; max-height: 86vh; }
    .modal-cover { width: 88px; height: 124px; }
    .similar-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<script>
'use strict';

// ---- 元素 & 状态 ----
const loginBtn = document.getElementById('loginbtn');
const logoutBtn = document.getElementById('logoutbtn');
const userLabel = document.getElementById('userlabel');
const meta = document.getElementById('meta');
const err = document.getElementById('err');
const content = document.getElementById('content');
const loginHint = document.getElementById('loginHint');
const searchBox = document.getElementById('searchbox');
const searchInput = document.getElementById('searchInput');
const modalOverlay = document.getElementById('modal');
const modalBody = document.getElementById('modal-body');
const modalCache = new Map();   // sid -> subject 详情（FIFO 300）
let modalOpenSid = null;        // 当前打开浮窗的 subject_id（竞态守卫）
// BGM 站点图标（与推荐页卡片外链同一份，data: URI 内联；浮窗/卡片跳转按钮用）
const BGM_ICO = 'data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAQAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALJu+f//////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAsm75ELJu+cCybvn/sm75/7Ju+f+ybvn//////7Ju+f+ybvn/sm75/7Ju+f+ybvn/sm75/7Ju+f+ybvnAsm75ELJu+cCybvn/sm75/7Ju+f+ybvn/sm75////////////sm75/7Ju+f+ybvn/sm75/7Ju+f+ybvn/sm75/7Ju+cCwaPn/sGj5/9iz/P///////////////////////////////////////////////////////////9iz/P+waPn/rF/6/6xf+v//////////////////////////////////////////////////////////////////////rF/6/6lW+/+pVvv/////////////////////////////////zXn2/////////////////////////////////6lW+/+lTfz/pU38///////Nefb/zXn2/8159v//////zXn2///////Nefb//////8159v/Nefb/zXn2//////+lTfz/okT8/6JE/P//////////////////////2bb8/8159v/Nefb/zXn2/9m2/P//////////////////////okT8/546/f+eOv3//////8159v/Nefb/zXn2////////////////////////////zXn2/8159v/Nefb//////546/f+bMf7/mzH+//////////////////////////////////////////////////////////////////////+bMf7/lyj+wJco/v/Mk/7////////////////////////////////////////////////////////////Mk///lyj+wJQf/xCUH//AlB///5Qf//+UH///lB///5Qf//+aP///mj///5o///+UH///lB///5Qf//+UH///lB//wJQf/xAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAzXn2/5o////Nefb/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAzXn2/wAAAAAAAAAAAAAAAM159v8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAzXn2/wAAAAAAAAAAAAAAAAAAAAAAAAAAzXn2/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAzXn2/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADNefb/AAAAAAAAAAAAAAAA+f8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/j8AAP3fAAD77wAA9/cAAA==';

let loggedIn = false;
let loadedOnce = false;          // 首次登录后只启动一次列表加载
let rateMap = new Map();         // subject_id -> {state, rate}（客户端状态唯一来源，overlay 装饰）
let currentQuery = '';           // '' = 热门列表
let abortCtrl = null;            // 搜索 AbortController（防抖/清空时打断在途请求）

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- 登录态 ----
async function refreshAuth() {
  try {
    const r = await fetch('/auth/me');
    const d = await r.json();
    loggedIn = !!d.logged_in;
    if (loggedIn) {
      userLabel.textContent = d.username;
      userLabel.classList.remove('hidden');
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      loginHint.classList.add('hidden');
      searchBox.classList.remove('hidden');
      if (!loadedOnce) {
        loadedOnce = true;
        showPopular();
        loadCollected();  // 并行：列表先渲染，收藏回来 overlay 补星
      }
    } else {
      rateMap = new Map();
      if (modalOpenSid && modalCache.has(modalOpenSid)) renderModal(modalCache.get(modalOpenSid));  // 登出后浮窗星区回登录链接
      userLabel.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      loginBtn.classList.remove('hidden');
      loginHint.classList.remove('hidden');
      searchBox.classList.add('hidden');
      content.innerHTML = '<div class="empty">登录后即可打分</div>';
    }
  } catch (e) {
    loggedIn = false;
    loginBtn.classList.remove('hidden');
    loginHint.classList.remove('hidden');
    searchBox.classList.add('hidden');
  }
}

// ---- 列表渲染 ----
function renderCards(items, emptyMsg) {
  if (!items.length) {
    content.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
    return;
  }
  content.innerHTML = items.map(cardHTML).join('');
  items.forEach(it => decorateCard(
    content.querySelector('.card[data-id="' + it.subject_id + '"]'), it.subject_id));
}

function cardHTML(it) {
  const cn = it.name_cn || it.name || '';
  const ja = it.name || '';
  const score = it.score ? Number(it.score).toFixed(1) : '';
  const date = it.date || '';
  let h = '<div class="card" data-id="' + it.subject_id + '">' +
    '<img class="cover" src="/img/' + it.subject_id + '" loading="lazy" alt="" onerror="this.remove()">' +
    '<div class="card-body">' +
      '<div class="name-cn">' + escapeHtml(cn) + '</div>' +
      (ja && ja !== cn ? '<div class="name-ja">' + escapeHtml(ja) + '</div>' : '') +
      '<div class="meta-row">' +
        (score ? '<span class="rating">⭐ ' + score + '</span>' : '') +
        (date ? '<span class="date">' + escapeHtml(date) + '</span>' : '') +
        '<span class="state-tag hidden"></span>' +
        (it.nsfw ? '<span class="nsfw-tag">NSFW</span>' : '') +
      '</div>' +
      '<div class="links">' +
        '<a class="link link-bgm" href="https://bgm.tv/subject/' + it.subject_id + '" target="_blank" rel="noopener" title="在 Bangumi 打开条目">' +
          '<img class="link-ico" src="' + BGM_ICO + '" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add(\'no-ico\')"><span class="link-txt">BGM</span></a>' +
        '<a class="link link-bili" href="https://search.bilibili.com/all?keyword=' + encodeURIComponent(it.name_cn || it.name || '') + '" target="_blank" rel="noopener" title="在 Bilibili 搜索该动画">' +
          '<img class="link-ico" src="https://www.bilibili.com/favicon.ico" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add(\'no-ico\')"><span class="link-txt">B站</span></a>' +
      '</div>' +
      '<div class="stars" data-sid="' + it.subject_id + '">';
  for (let i = 1; i <= 10; i++) h += '<span class="star" data-v="' + i + '">★</span>';
  h += '<span class="star-num"></span>' +
       '<span class="rated-badge hidden"></span>' +
       '<button class="clear-btn hidden" title="清除评分（保留看过状态）">✕ 清除评分</button>' +
    '</div>' +
  '</div></div>';
  return h;
}

const STATE_CLS = { '在看':'watching', '看过':'watched', '想看':'want', '搁置':'hold', '抛弃':'dropped' };

// 用 rateMap 装饰一张卡片（星形填满 + 徽标 + 清除按钮 + 状态标签）
function decorateCard(card, sid) {
  if (!card) return;
  const row = card.querySelector('.stars');
  const cur = rateMap.get(sid);
  const v = cur ? cur.rate : 0;
  fillStars(row, v);
  setNum(row, '');
  const badge = card.querySelector('.rated-badge');
  const clearBtn = card.querySelector('.clear-btn');
  const stateTag = card.querySelector('.state-tag');
  if (cur && cur.rate > 0) {
    badge.textContent = '看过 ' + cur.rate + '分';
    badge.classList.remove('hidden');
    clearBtn.classList.remove('hidden');
    stateTag.classList.add('hidden');
  } else {
    badge.classList.add('hidden');
    clearBtn.classList.add('hidden');
    if (cur && cur.state) {
      stateTag.textContent = cur.state;
      stateTag.className = 'state-tag state--' + (STATE_CLS[cur.state] || 'other');
    } else {
      stateTag.classList.add('hidden');
    }
  }
}

function fillStars(row, v) {
  if (!row) return;
  row.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('on', Number(s.dataset.v) <= v);
  });
}
function setNum(row, text) {
  if (!row) return;
  const n = row.querySelector('.star-num');
  if (n) n.textContent = text;
}

// ---- 热门列表（未搜索时）----
async function showPopular() {
  meta.textContent = '加载热门…';
  err.classList.add('hidden');
  try {
    const r = await fetch('/api/rate/popular?limit=50');
    if (r.status === 401) { await refreshAuth(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    meta.textContent = '';
    renderCards(d.data || [], '暂无热门动画');
  } catch (e) {
    err.classList.remove('hidden');
    err.textContent = '加载失败：' + (e.message || e) + '，请重试';
    meta.textContent = '';
  }
}

// ---- 搜索（防抖 + AbortController）----
async function doSearch(q) {
  currentQuery = q;
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  meta.textContent = '搜索中…';
  err.classList.add('hidden');
  try {
    const r = await fetch('/api/rate/search?q=' + encodeURIComponent(q) + '&limit=20',
                          {signal: abortCtrl.signal});
    if (r.status === 401) { await refreshAuth(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    meta.textContent = '';
    renderCards(d.data || [], '没有找到相关动画');
  } catch (e) {
    if (e.name === 'AbortError') return;  // 被新的搜索/清空打断，忽略
    err.classList.remove('hidden');
    err.textContent = '搜索失败：' + (e.message || e) + '，请重试';
    meta.textContent = '';
  }
}

let debounceTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (!q) {
    if (abortCtrl) abortCtrl.abort();
    currentQuery = '';
    meta.textContent = '';
    showPopular();
    return;
  }
  debounceTimer = setTimeout(() => doSearch(q), 250);
});

// ---- 收藏 overlay（拉一次，装饰所有卡片）----
async function loadCollected() {
  try {
    const r = await fetch('/api/rate/collections');
    if (r.status === 401 || !r.ok) return;
    const d = await r.json();
    rateMap = new Map();
    (d.items || []).forEach(it => rateMap.set(it.subject_id, {state: it.state, rate: it.rate}));
    if (d.profile_nsfw && !currentQuery) {
      showPopular();  // 用户有 nsfw 口味：热门列表需含 nsfw 项，重拉
    } else {
      content.querySelectorAll('.card').forEach(c => decorateCard(c, Number(c.dataset.id)));
      if (modalOpenSid) {
        const row = modalBody.querySelector('.stars');
        if (row) decorateModalStars(row, modalOpenSid);
      }
    }
  } catch (e) { /* overlay 失败降级空星，不影响列表 */ }
}

// ---- 打分 / 清除 ----
function setBusy(sid, busy) {
  const card = content.querySelector('.card[data-id="' + sid + '"]');
  if (card) card.classList.toggle('busy', busy);
  const row = modalBody.querySelector('.stars[data-sid="' + sid + '"]');
  if (row) row.classList.toggle('busy', busy);
}

async function rate(sid, value) {
  setBusy(sid, true);
  try {
    const r = await fetch('/api/rate/' + sid, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({rate: value}),
    });
    if (r.status === 401) { await refreshAuth(); alert('登录已过期，请重新登录'); return; }
    if (!r.ok) { alert('评分失败（' + r.status + '），请重试'); return; }
    rateMap.set(sid, {state: '看过', rate: value});
    decorateCard(content.querySelector('.card[data-id="' + sid + '"]'), sid);
    if (modalOpenSid === sid) decorateModalStars(modalBody.querySelector('.stars'), sid);
  } catch (e) { alert('网络错误，请重试'); }
  finally { setBusy(sid, false); }
}

async function clearRate(sid) {
  setBusy(sid, true);
  try {
    const r = await fetch('/api/rate/' + sid, {method: 'DELETE'});
    if (r.status === 401) { await refreshAuth(); alert('登录已过期，请重新登录'); return; }
    if (!r.ok) { alert('清除失败（' + r.status + '），请重试'); return; }
    // BGM 无删除收藏接口：清除 = 评分归零、保留"看过"状态（对齐站内"删除评分"）
    const cur = rateMap.get(sid);
    rateMap.set(sid, {state: (cur && cur.state) || '看过', rate: 0});
    decorateCard(content.querySelector('.card[data-id="' + sid + '"]'), sid);
    if (modalOpenSid === sid) decorateModalStars(modalBody.querySelector('.stars'), sid);
  } catch (e) { alert('网络错误，请重试'); }
  finally { setBusy(sid, false); }
}

// ---- 事件委托（hover 预览 + 点击打分）----
content.addEventListener('mouseover', (e) => {
  const star = e.target.closest('.star');
  if (!star) return;
  const row = star.closest('.stars');
  fillStars(row, Number(star.dataset.v));
  setNum(row, star.dataset.v);
});
content.addEventListener('mouseout', (e) => {
  const row = e.target.closest('.stars');
  if (!row) return;
  if (e.relatedTarget && row.contains(e.relatedTarget)) return;  // 仍在行内移动
  const sid = Number(row.dataset.sid);
  const cur = rateMap.get(sid);
  fillStars(row, cur ? cur.rate : 0);
  setNum(row, '');
});
content.addEventListener('click', (e) => {
  const clearBtn = e.target.closest('.clear-btn');
  if (clearBtn) { e.stopPropagation(); clearRate(Number(clearBtn.closest('.stars').dataset.sid)); return; }
  const star = e.target.closest('.star');
  if (star) {
    e.stopPropagation();
    const sid = Number(star.closest('.stars').dataset.sid);
    const v = Number(star.dataset.v);
    const cur = rateMap.get(sid);
    if (cur && cur.rate === v) { clearRate(sid); return; }  // 点击当前分再点 → 清除
    rate(sid, v);
    return;
  }
  if (e.target.closest('a.link')) return;    // BGM/B站 外链照常新标签打开
  const card = e.target.closest('.card');
  if (card && card.dataset.id) openModal(Number(card.dataset.id));  // 点卡片 → 简介浮窗
});

// ---- 卡片浮窗（简介 + 相似动画 + 跳转，对齐 /likes /daily）----
async function openModal(sid) {
  modalOpenSid = sid;
  modalOverlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';        // 滚动锁
  modalOverlay.querySelector('.modal').scrollTop = 0;
  modalBody.innerHTML = '<div class="modal-empty">加载中…</div>';
  if (modalCache.has(sid)) { renderModal(modalCache.get(sid)); return; }
  try {
    const res = await fetch('/api/subject/' + sid);
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || ('HTTP ' + res.status));
    }
    const data = await res.json();
    modalCache.set(sid, data);
    if (modalCache.size > 300) modalCache.delete(modalCache.keys().next().value);  // FIFO 防长期膨胀
    if (modalOpenSid === sid) renderModal(data);   // 已被新请求替换则丢弃
  } catch (e) {
    if (modalOpenSid === sid)
      modalBody.innerHTML = '<div class="modal-empty">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

function renderModal(d) {
  const sim = (d.similar || []).map(s => `
    <div class="similar-item" data-sid="${s.subject_id}" title="查看详情">
      <img class="sc" src="/img/${s.subject_id}" loading="lazy" alt="" onerror="this.remove()">
      <div><div class="sc-name">${escapeHtml(s.name || '')}</div>
      ${s.rating ? '<div class="sc-rate">⭐ ' + s.rating.toFixed(1) + '</div>' : ''}</div>
    </div>`).join('');
  modalBody.innerHTML = `
    <div class="modal-head">
      <img class="modal-cover" src="/img/${d.subject_id}" loading="lazy" alt="" onerror="this.remove()">
      <div class="modal-info">
        <div class="modal-title-row">
          <div class="modal-title">${escapeHtml(d.name || '')}</div>
          <div class="modal-actions">
            <a class="modal-link modal-link-bgm" href="https://bgm.tv/subject/${d.subject_id}" target="_blank" rel="noopener" title="在 Bangumi 打开条目"><img class="mi-ico" src="${BGM_ICO}" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add('no-ico')"><span class="mi-txt">BGM</span></a>
            <a class="modal-link modal-link-bili" href="https://search.bilibili.com/all?keyword=${encodeURIComponent(d.name_cn || d.name || '')}" target="_blank" rel="noopener" title="在 Bilibili 搜索该动画"><img class="mi-ico" src="https://www.bilibili.com/favicon.ico" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add('no-ico')"><span class="mi-txt">B站</span></a>
          </div>
        </div>
        ${d.rating ? '<div class="modal-rating">⭐ ' + d.rating.toFixed(1) + '</div>' : ''}
        ${d.date ? '<div class="modal-date">' + escapeHtml(d.date) + '</div>' : ''}
        ${(d.tags || []).map(t => '<span class="modal-tag">' + escapeHtml(t) + '</span>').join('')}
      </div>
    </div>
    ${modalStarsHtml(d.subject_id)}
    <div class="modal-section">简介</div>
    <div class="modal-summary"></div>
    <div class="modal-section">相似动画</div>
    <div class="similar-grid">${sim || '<div class="modal-empty">暂无相似</div>'}</div>`;
  // 简介用 textContent + CSS pre-line 注入（从根上防 XSS，不 innerHTML）
  modalBody.querySelector('.modal-summary').textContent = cleanSummary(d.summary || '');
  decorateModalStars(modalBody.querySelector('.stars'), d.subject_id);
}

function closeModal() {
  modalOverlay.classList.add('hidden');
  document.body.style.overflow = '';   // 解锁滚动
  modalOpenSid = null;
}

// summary 纯文本清洗（同 index.html）：块级/换行标签转 \n，剥掉残留标签与实体
function cleanSummary(raw) {
  return String(raw || '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|li|h[1-6]|tr)>/gi, '\n')
    .replace(/<p[^>]*>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&amp;/gi, '&').replace(/&quot;/gi, '"')
    .replace(/&#0*39;/gi, "'").replace(/&#x0*27;/gi, "'");
}

// 星形行 HTML：未登录 → 登录链接（浮窗仍可看简介）；登录 → 10 星 + 数字 + 徽标 + 清除
function modalStarsHtml(sid) {
  if (!loggedIn) {
    return '<div class="modal-rate-hint">🔒 <a href="/auth/login">登录后可打分</a></div>';
  }
  let h = '<div class="stars" data-sid="' + sid + '">';
  for (let i = 1; i <= 10; i++) h += '<span class="star" data-v="' + i + '" title="' + i + ' 分">★</span>';
  h += '<span class="star-num"></span>' +
       '<span class="rated-badge hidden"></span>' +
       '<button class="clear-btn hidden" title="清除评分（保留看过状态）">✕ 清除评分</button>' +
       '</div>';
  return h;
}

// 用 rateMap 装饰浮窗星行（星形填满 + 徽标 + 清除按钮）
function decorateModalStars(row, sid) {
  if (!row) return;
  const cur = rateMap.get(sid);
  const v = cur ? cur.rate : 0;
  fillStars(row, v);
  setNum(row, '');
  const badge = row.querySelector('.rated-badge');
  const clearBtn = row.querySelector('.clear-btn');
  if (cur && cur.rate > 0) {
    badge.textContent = '看过 ' + cur.rate + '分';
    badge.classList.remove('hidden');
    clearBtn.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
    clearBtn.classList.add('hidden');
  }
}

// 关闭三途径：✕ 按钮 / 点遮罩 / Esc
modalOverlay.querySelector('.modal-close').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) closeModal();
});

// 浮窗星形悬浮预览（不落库，mouseout 恢复 rateMap 值）
modalBody.addEventListener('mouseover', (e) => {
  const star = e.target.closest('.star');
  if (!star) return;
  const row = star.closest('.stars');
  fillStars(row, Number(star.dataset.v));
  setNum(row, star.dataset.v);
});
modalBody.addEventListener('mouseout', (e) => {
  const row = e.target.closest('.stars');
  if (!row) return;
  if (e.relatedTarget && row.contains(e.relatedTarget)) return;  // 仍在行内移动
  const sid = Number(row.dataset.sid);
  const cur = rateMap.get(sid);
  fillStars(row, cur ? cur.rate : 0);
  setNum(row, '');
});
// 浮窗点击：清除 / 打分 / 相似项跳转（modal-link 外链走默认新标签）
modalBody.addEventListener('click', (e) => {
  const clearBtn = e.target.closest('.clear-btn');
  if (clearBtn) { clearRate(Number(clearBtn.closest('.stars').dataset.sid)); return; }
  const star = e.target.closest('.star');
  if (star) {
    const sid = Number(star.closest('.stars').dataset.sid);
    const v = Number(star.dataset.v);
    const cur = rateMap.get(sid);
    if (cur && cur.rate === v) { clearRate(sid); return; }  // 点击当前分再点 → 清除
    rate(sid, v);
    return;
  }
  const it = e.target.closest('.similar-item');
  if (it) openModal(Number(it.dataset.sid));
});

// ---- 登录/退出 ----
loginBtn.addEventListener('click', () => { window.location = '/auth/login'; });
logoutBtn.addEventListener('click', async () => {
  try { await fetch('/auth/logout', {method:'POST'}); } catch (e) {}
  window.location.reload();
});

// ---- 启动 ----
refreshAuth();
(function () {
  const el = document.getElementById('petals');
  if (!el) return;
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    const dur = (7 + Math.random() * 6).toFixed(2);
    const size = (10 + Math.random() * 9).toFixed(1);
    p.style.cssText = 'left:' + (Math.random() * 100).toFixed(2) + '%;' +
      '--size:' + size + 'px;--dur:' + dur + 's;--delay:-' + (Math.random() * dur).toFixed(2) + 's;';
    el.appendChild(p);
  }
})();
</script>
