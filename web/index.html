<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bgmlikes · Bangumi 动画推荐</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --line:#2a2f3a; --text:#e8eaf0; --sub:#9aa0ac; --accent:#5b8cff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; min-height:100vh; }
  .wrap { max-width:640px; margin:0 auto; padding:48px 20px 80px; }
  h1 { font-size:24px; margin-bottom:4px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:28px; }
  .search { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { padding:12px 20px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.sec { background:transparent; border:1px solid var(--accent); color:var(--accent); }
  .meta { color:var(--sub); font-size:13px; margin-top:18px; min-height:20px; }
  .card { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-top:12px; }
  .cover { width:56px; height:76px; object-fit:cover; border-radius:8px; background:var(--bg); flex-shrink:0; }
  .card .rank { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; background:var(--accent); color:#fff; font-size:13px; font-weight:600; margin-right:10px; vertical-align:middle; }
  .card .name { font-size:16px; font-weight:600; vertical-align:middle; }
  .card .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .card .badge.cold { background:rgba(91,140,255,.15); color:var(--accent); border:1px solid rgba(91,140,255,.35); }
  .card .badge.hot { background:rgba(154,160,172,.12); color:var(--sub); border:1px solid rgba(154,160,172,.25); }
  .card .hide { margin-left:auto; flex-shrink:0; width:28px; height:28px; padding:0; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--sub); font-size:14px; line-height:1; cursor:pointer; opacity:.55; }
  .card .hide:hover { opacity:1; color:#fff; border-color:rgba(255,107,107,.6); background:rgba(255,107,107,.15); }
  .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .autharea { display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .autharea button { padding:8px 14px; font-size:13px; }
  #userlabel { color:var(--sub); font-size:13px; }
  .tabs { display:flex; gap:8px; margin-top:20px; }
  .tab { flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--sub); font-size:14px; cursor:pointer; text-align:center; }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .restore { margin-top:16px; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:12px 16px; }
  .restore h3 { font-size:13px; color:var(--sub); margin-bottom:4px; font-weight:600; }
  .restore .row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; font-size:14px; }
  .restore .row button { padding:4px 10px; font-size:12px; border-radius:8px; }
  .restore .clear { display:block; margin-top:8px; padding:6px 12px; font-size:12px; border-radius:8px; background:transparent; border:1px solid var(--line); color:var(--sub); cursor:pointer; }
  .restore .clear:hover { color:#ff6b6b; border-color:rgba(255,107,107,.5); }
  .err { color:#ff6b6b; font-size:14px; margin-top:16px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>bgmlikes</h1>
      <div class="sub">输入 Bangumi 用户名，获得个性化动画推荐 · <a href="https://bgm.tv" target="_blank" style="color:var(--accent)">bgm.tv</a></div>
    </div>
    <div id="autharea" class="autharea">
      <button id="loginbtn" class="sec hidden">登录 (Bangumi)</button>
      <span id="userlabel" class="hidden"></span>
      <button id="logoutbtn" class="sec hidden">退出</button>
    </div>
  </div>

  <div class="search">
    <input id="q" placeholder="Bangumi 用户名（不是昵称，主页URL里的名字）" autocomplete="off" />
    <button id="go">推荐</button>
    <button id="export" class="sec" disabled>导出 JPG</button>
  </div>

  <div id="tabs" class="tabs hidden">
    <button class="tab active" data-tab="normal">动画推荐</button>
    <button class="tab" data-tab="cold">冷门发现</button>
  </div>

  <div id="meta" class="meta"></div>
  <div id="err" class="err hidden"></div>
  <div id="list"></div>
  <div id="restore" class="restore hidden"></div>
</div>

<script>
const q = document.getElementById('q');
const go = document.getElementById('go');
const exportBtn = document.getElementById('export');
const loginBtn = document.getElementById('loginbtn');
const logoutBtn = document.getElementById('logoutbtn');
const userLabel = document.getElementById('userlabel');
const tabs = document.getElementById('tabs');
const meta = document.getElementById('meta');
const err = document.getElementById('err');
const list = document.getElementById('list');
const restore = document.getElementById('restore');
let lastData = null;
let activeTab = 'normal';  // 'normal' 动画推荐 / 'cold' 冷门发现
let hidden = new Map();    // sid -> name（登录后从服务端加载的"不感兴趣"）
let loggedIn = false;      // 是否已登录（隐藏功能的前提）
let me = null;             // 登录用户的 Bangumi 用户名

// ---- 登录态 ----
async function refreshAuth() {
  try {
    const r = await fetch('/auth/me');
    const d = await r.json();
    loggedIn = !!d.logged_in;
    if (loggedIn) {
      me = d.username;
      userLabel.textContent = me;
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      userLabel.classList.remove('hidden');
      await loadHiddenServer();
    } else {
      me = null;
      hidden.clear();
      userLabel.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      loginBtn.classList.remove('hidden');
    }
    renderList();
    updateMeta();
  } catch (e) {
    loggedIn = false;
    loginBtn.classList.remove('hidden');
  }
}

async function loadHiddenServer() {
  try {
    const r = await fetch('/preferences/hidden');
    if (!r.ok) return;
    const d = await r.json();
    hidden = new Map();
    // 名字暂未知（需 subject 名），用空，恢复区可显示 subject_id；到渲染时再从 lastData 补名
    (d.hidden || []).forEach(sid => hidden.set(sid, ''));
    // 从当前推荐列表补齐名字（便于恢复区显示）
    (lastData ? (lastData.normal || []).concat(lastData.cold || []) : []).forEach(rr => {
      if (hidden.has(rr.subject_id)) hidden.set(rr.subject_id, rr.name);
    });
  } catch (e) {}
}

async function recommend() {
  const username = q.value.trim();
  if (!username) return;
  err.classList.add('hidden');
  list.innerHTML = '';
  restore.classList.add('hidden');
  restore.innerHTML = '';
  tabs.classList.add('hidden');
  meta.textContent = '正在拉取用户数据…';
  go.disabled = true;
  exportBtn.disabled = true;
  try {
    const res = await fetch('/v1/recommend', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      // k=40：推荐池 40 部，隐藏某条后由池内下一位替补（前端显示前 20）
      body: JSON.stringify({username, k: 40})
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || `HTTP ${res.status}`);
    }
    const d = await res.json();
    lastData = d;
    activeTab = 'normal';
    // 已登录：重新从服务端拉"不感兴趣"（比上次推荐时的可能新增），并补当前列表名
    if (loggedIn) await loadHiddenServer();
    tabs.classList.remove('hidden');
    [...tabs.children].forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
    exportBtn.disabled = false;
    updateMeta();
    renderList();
  } catch (e) {
    err.classList.remove('hidden');
    err.textContent = e.message;
    meta.textContent = '';
  } finally {
    go.disabled = false;
  }
}

// 当前 tab 对应的推荐池（40 条，来自 API；前端保持"哑"）
function allRecs() {
  if (!lastData) return [];
  return activeTab === 'cold' ? (lastData.cold || []) : (lastData.normal || []);
}

// 当前查看的是不是登录用户自己（"不感兴趣"只对自己可见/可用，不能改别人的喜好）
function viewingSelf() {
  return loggedIn && !!me && !!lastData
    && String(lastData.username).toLowerCase() === String(me).toLowerCase();
}

// 可见列表：取前 20 条；仅"查看自己"时应用"不感兴趣"过滤，隐藏后空位由池内下一位替补
function visibleRecs() {
  if (!lastData) return [];
  const pool = activeTab === 'cold' ? (lastData.cold || []) : (lastData.normal || []);
  return (viewingSelf() ? pool.filter(r => !hidden.has(r.subject_id)) : pool).slice(0, 20);
}

function renderList() {
  const self = viewingSelf();
  list.innerHTML = visibleRecs().map((r, i) => `
    <div class="card">
      <img class="cover" src="/img/${r.subject_id}" loading="lazy" alt="" onerror="this.remove()">
      <span class="rank">${i + 1}</span><span class="name">${escapeHtml(r.name ?? '')}</span>
      ${self ? `<button class="hide" data-sid="${r.subject_id}" title="不感兴趣">✕</button>` : ''}
    </div>`).join('');
  renderRestore();
}

function updateMeta() {
  if (!lastData) { meta.textContent = ''; return; }
  const d = lastData;
  let t = `${d.username} 的推荐（${activeTab === 'cold' ? '冷门发现' : '动画推荐'} ${visibleRecs().length} 条`;
  if (viewingSelf() && hidden.size) t += ` · 已隐藏 ${hidden.size} 条`;
  t += '）';
  if (d.source === 'cache') t += ' · ⚠ 本地缓存（Bangumi 暂不可达）';
  meta.textContent = t;
}

// 误操作兜底：展开"已隐藏"列表，可单项恢复 / 清空全部（仅"查看自己"时显示）
function renderRestore() {
  if (!viewingSelf() || !hidden.size) { restore.classList.add('hidden'); restore.innerHTML = ''; return; }
  restore.classList.remove('hidden');
  restore.innerHTML = `
    <h3>已隐藏 ${hidden.size} 条（不感兴趣）</h3>
    ${[...hidden].map(([sid, name]) => `
      <div class="row">
        <span>${escapeHtml(name || '未知')}</span>
        <button class="sec" data-resid="${sid}">恢复</button>
      </div>`).join('')}
    <button class="clear">清空全部</button>`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

go.addEventListener('click', recommend);
q.addEventListener('keydown', e => { if (e.key === 'Enter') recommend(); });
tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  activeTab = b.dataset.tab;
  [...tabs.children].forEach(t => t.classList.toggle('active', t === b));
  renderList();
  updateMeta();
});
// 隐藏/恢复都需登录：未登录提示"请先登录"，不修改任何内容
async function toggleHidden(sid, toHide) {
  if (!loggedIn) {
    alert('请先登录后才能隐藏/恢复动画');
    return;
  }
  try {
    const r = await fetch('/preferences/hidden/' + sid, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hidden: toHide}),
    });
    if (r.status === 401) {
      await refreshAuth();  // 会话过期：回到未登录态
      alert('登录已过期，请重新登录');
      return;
    }
    if (!r.ok) { alert('保存失败，请重试'); return; }
    if (toHide) {
      const rec = allRecs().find(x => x.subject_id === sid);
      hidden.set(sid, rec ? rec.name : '');
    } else {
      hidden.delete(sid);
    }
    updateMeta();
    renderList();
  } catch (e) { alert('网络错误，请重试'); }
}

// 隐藏（"不感兴趣"）点击 → 服务端存 → 列表过滤补位
list.addEventListener('click', e => {
  const b = e.target.closest('.hide');
  if (!b || !lastData) return;
  toggleHidden(Number(b.dataset.sid), true);
});
// 恢复：单项恢复 / 清空全部
restore.addEventListener('click', e => {
  const b = e.target.closest('[data-resid]');
  if (b) toggleHidden(Number(b.dataset.resid), false);
  else if (e.target.classList.contains('clear')) clearAllHidden();
  else return;
});

async function clearAllHidden() {
  if (!loggedIn) { alert('请先登录'); return; }
  try {
    const r = await fetch('/preferences/hidden', {method: 'DELETE'});
    if (r.status === 401) { await refreshAuth(); alert('登录已过期，请重新登录'); return; }
    if (!r.ok) { alert('清空失败，请重试'); return; }
    hidden.clear();
    updateMeta();
    renderList();
  } catch (e) { alert('网络错误，请重试'); }
}

// ---- 登录 / 退出 ----
loginBtn.addEventListener('click', () => { window.location = '/auth/login'; });
logoutBtn.addEventListener('click', async () => {
  try { await fetch('/auth/logout', {method: 'POST'}); } catch (e) {}
  window.location.reload();
});

// 页面载入：恢复登录态 + 拉"不感兴趣"
refreshAuth();

/* ---- 导出 JPG（原生 canvas 手绘，零依赖） ---- */
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const COLORS = { bg:'#0f1115', card:'#1a1e26', text:'#e8eaf0', sub:'#9aa0ac', accent:'#5b8cff' };

function preloadImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawRoundedImage(ctx, img, x, y, w, h, r) {
  ctx.save();
  roundRect(ctx, x, y, w, h, r);
  ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let cur = '';
  for (const ch of text) {
    if (cur && ctx.measureText(cur + ch).width > maxWidth) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

function ellipsis(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
  return t + '…';
}

async function exportJpg() {
  const data = lastData;
  if (!data) return;
  const isCold = activeTab === 'cold';  // 导出当前 tab 所在区域
  const recs = visibleRecs();  // 导出当前看到的（已过滤"不感兴趣"）列表
  if (!recs || !recs.length) return;
  exportBtn.disabled = true;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const covers = await Promise.all(recs.map(r => preloadImage('/img/' + r.subject_id)));

    const W = 640, PAD = 24;
    const ROW_H = 88, GAP = 10;
    const TITLE_BOTTOM = 90, PAD_BOTTOM = 24;
    const H = TITLE_BOTTOM + recs.length * (ROW_H + GAP) - GAP + PAD_BOTTOM;

    const canvas = document.createElement('canvas');
    canvas.width = W * 2; canvas.height = H * 2;  // ×2 保证清晰
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);

    ctx.fillStyle = COLORS.bg;  // JPG 无透明，先铺满
    ctx.fillRect(0, 0, W, H);

    // 顶部标题：{用户名} 的动画推荐 / 冷门发现（按当前 tab）
    ctx.fillStyle = COLORS.text;
    ctx.font = 'bold 28px ' + FONT;
    ctx.fillText((data.username || '') + (isCold ? ' 的冷门发现' : ' 的动画推荐'), PAD, 60);

    const now = new Date();
    const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

    // 行（只保留条目：封面 + 名称，无排名/角标/卡片衬底）
    recs.forEach((r, i) => {
      const y = TITLE_BOTTOM + i * (ROW_H + GAP);
      const cx = PAD, cy = y + (ROW_H - 76) / 2;
      // 封面（失败 → 占位块 + 首字）
      if (covers[i]) {
        drawRoundedImage(ctx, covers[i], cx, cy, 56, 76, 8);
      } else {
        ctx.fillStyle = '#11151c';
        roundRect(ctx, cx, cy, 56, 76, 8);
        ctx.fill();
        ctx.fillStyle = COLORS.sub;
        ctx.font = '600 20px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText((r.name || '?').charAt(0), cx + 28, cy + 48);
        ctx.textAlign = 'left';
      }
      // 名称（最多 2 行，超长省略号），垂直居中
      const nameX = cx + 56 + 14;
      const nameMax = W - PAD - nameX;
      ctx.font = 'bold 16px ' + FONT;
      const lines = wrapText(ctx, r.name || '（未知）', nameMax).slice(0, 2);
      if (lines.length === 2 && ctx.measureText(lines[1] + '…').width > nameMax) {
        lines[1] = ellipsis(ctx, lines[1], nameMax);
      }
      const midY = y + ROW_H / 2;
      ctx.fillStyle = COLORS.text;
      if (lines.length === 1) {
        ctx.fillText(lines[0], nameX, midY + 6);
      } else {
        ctx.fillText(lines[0], nameX, midY - 6);
        ctx.fillText(lines[1], nameX, midY + 24);
      }
    });

    const safeName = (data.username || 'user').replace(/[\\/:*?"<>|\s]/g, '_');
    canvas.toBlob(blob => {
      if (blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bgmlikes-' + safeName + (isCold ? '-cold' : '') + '-' + dateStr + '.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }
      exportBtn.disabled = false;
    }, 'image/jpeg', 0.92);
  } catch (e) {
    console.error('导出失败', e);
    exportBtn.disabled = false;
  }
}

exportBtn.addEventListener('click', exportJpg);
</script>
</body>
</html>
