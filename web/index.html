<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bgmlikes · Bangumi 动画推荐</title>
<style>
  :root {
    --bg1: #fff0f5; --bg2: #fff8fb;
    --card: rgba(255,255,255,.72);
    --line: rgba(242,109,157,.18);
    --text: #4a3f4e; --sub: #b39aa8;
    --accent: #f26d9d; --accent-soft: #ffb3d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--text);
    font-family: "Yu Gothic Rounded","Yu Gothic","Hiragino Maru Gothic ProN","Varela Round","PingFang SC","Microsoft YaHei",sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 樱花花瓣飘落 */
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; top: -8vh; left: 0;
    width: var(--size, 14px); height: var(--size, 14px);
    background: radial-gradient(circle at 32% 32%, #ffe3f0, #ffb3d1 55%, #ff8fb8);
    border-radius: 78% 22% 76% 24% / 62% 40% 60% 38%;
    opacity: 0;
    box-shadow: 0 0 6px rgba(242,109,157,.15);
    animation: petal-fall var(--dur, 10s) linear var(--delay, 0s) infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate3d(0, -6vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .9; }
    25%  { transform: translate3d(26px, 24vh, 0) rotate(96deg); opacity: .9; }
    50%  { transform: translate3d(-20px, 50vh, 0) rotate(190deg); opacity: .85; }
    75%  { transform: translate3d(24px, 76vh, 0) rotate(286deg); opacity: .7; }
    100% { transform: translate3d(-12px, 108vh, 0) rotate(360deg); opacity: 0; }
  }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 {
    font-size: 26px; margin-bottom: 4px; color: #e85f8d; letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(242,109,157,.35), 0 0 34px rgba(255,179,209,.35);
  }
  .sub { color: var(--sub); font-size: 13px; margin-bottom: 28px; line-height: 1.6; }
  .search { display: flex; gap: 10px; }
  .searchbox { position: relative; flex: 1; }
  .searchbox .icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: #d8a7c0; fill: none; stroke-width: 2;
    stroke-linecap: round; pointer-events: none;
  }
  input {
    width: 100%; padding: 14px 18px 14px 44px; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.22); background: rgba(255,255,255,.85);
    color: var(--text); font-size: 15px; outline: none;
    box-shadow: 0 2px 10px rgba(242,109,157,.08);
    transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #cbaec0; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(242,109,157,.12), 0 4px 14px rgba(242,109,157,.12); }
  button {
    padding: 14px 24px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--accent-soft) 0%, var(--accent) 100%);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(242,109,157,.28);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(242,109,157,.4); filter: brightness(1.04); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.sec { background: rgba(255,255,255,.75); border: 1px solid rgba(242,109,157,.28); color: var(--accent); box-shadow: none; }
  .meta { color: var(--sub); font-size: 13px; margin-top: 18px; min-height: 20px; }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 20px; padding: 14px 18px; margin-top: 14px;
    box-shadow: 0 6px 22px rgba(242,109,157,.10), 0 2px 8px rgba(242,109,157,.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(242,109,157,.18); }
  .cover {
    width: 56px; height: 76px; object-fit: cover; border-radius: 10px;
    background: #ffe9f2; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(242,109,157,.18);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover .cover { transform: scale(1.07); box-shadow: 0 4px 14px rgba(242,109,157,.28); }
  .card .rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: 0 2px 6px rgba(242,109,157,.35);
    margin-right: 8px; vertical-align: middle; flex-shrink: 0;
  }
  .card .name { font-size: 16px; font-weight: 600; vertical-align: middle; }
  .card .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  .card .badge.cold { background: rgba(242,109,157,.12); color: var(--accent); border: 1px solid rgba(242,109,157,.3); }
  .card .badge.hot { background: rgba(179,154,168,.12); color: var(--sub); border: 1px solid rgba(179,154,168,.25); }
  .card .hide {
    margin-left: auto; flex-shrink: 0; width: 30px; height: 30px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(242,109,157,.22);
    background: rgba(255,255,255,.6); color: var(--sub);
    font-size: 14px; line-height: 1; cursor: pointer; opacity: .6; box-shadow: none;
  }
  .card .hide:hover { opacity: 1; color: var(--accent); border-color: rgba(242,109,157,.5); background: rgba(255,179,209,.25); }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .autharea { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .autharea button { padding: 8px 14px; font-size: 13px; }
  #userlabel { color: var(--sub); font-size: 13px; }
  .tabs { display: flex; gap: 10px; margin-top: 20px; }
  .tab {
    flex: 1; padding: 11px 0; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.2); background: #fff7fa;
    color: var(--accent); font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: center; box-shadow: none;
  }
  .tab.active { background: linear-gradient(135deg, var(--accent-soft), var(--accent)); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(242,109,157,.3); }
  .restore {
    margin-top: 16px; border: 1px solid rgba(255,255,255,.65); border-radius: 20px;
    background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 14px 18px; box-shadow: 0 6px 22px rgba(242,109,157,.1);
  }
  .restore h3 { font-size: 13px; color: var(--sub); margin-bottom: 4px; font-weight: 600; }
  .restore .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: 14px; }
  .restore .row button { padding: 5px 12px; font-size: 12px; border-radius: 999px; background: rgba(255,255,255,.8); border: 1px solid rgba(242,109,157,.28); color: var(--accent); box-shadow: none; }
  .restore .clear { display: block; margin-top: 8px; padding: 6px 14px; font-size: 12px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(242,109,157,.25); color: var(--sub); cursor: pointer; box-shadow: none; }
  .restore .clear:hover { color: var(--accent); border-color: rgba(242,109,157,.5); }
  .err { color: #e85f8d; font-size: 14px; margin-top: 16px; }
  .hidden { display: none; }
  /* 小屏适配 */
  @media (max-width: 480px) {
    .wrap { padding: 28px 14px 60px; }
    h1 { font-size: 22px; }
    .card { padding: 12px 14px; }
    .cover { width: 48px; height: 66px; }
  }
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>🌸 bgmLikes</h1>
      <div class="sub">输入 Bangumi 用户名，获得个性化动画推荐 · <a href="https://bgm.tv" target="_blank" style="color:var(--accent)">bgm.tv</a></div>
    </div>
    <div id="autharea" class="autharea">
      <button id="loginbtn" class="sec hidden">登录 (Bangumi)</button>
      <span id="userlabel" class="hidden"></span>
      <button id="logoutbtn" class="sec hidden">退出</button>
    </div>
  </div>

  <div class="search">
    <div class="searchbox">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input id="q" placeholder="输入 Bangumi 用户名，获得樱花下的推荐" autocomplete="off" />
    </div>
    <button id="go">推荐</button>
    <button id="export" class="sec" disabled>导出 JPG</button>
  </div>

  <div id="tabs" class="tabs hidden">
    <button class="tab active" data-tab="normal">动画推荐</button>
    <button class="tab" data-tab="cold">冷门发现</button>
  </div>

  <div id="meta" class="meta"></div>
  <div id="err" class="err hidden"></div>
  <div id="list"></div>
  <div id="restore" class="restore hidden"></div>
</div>

<script>
const q = document.getElementById('q');
const go = document.getElementById('go');
const exportBtn = document.getElementById('export');
const loginBtn = document.getElementById('loginbtn');
const logoutBtn = document.getElementById('logoutbtn');
const userLabel = document.getElementById('userlabel');
const tabs = document.getElementById('tabs');
const meta = document.getElementById('meta');
const err = document.getElementById('err');
const list = document.getElementById('list');
const restore = document.getElementById('restore');
let lastData = null;
let activeTab = 'normal';  // 'normal' 动画推荐 / 'cold' 冷门发现
let hidden = new Map();    // sid -> name（登录后从服务端加载的"不感兴趣"）
let loggedIn = false;      // 是否已登录（隐藏功能的前提）
let me = null;             // 登录用户的 Bangumi 用户名

// ---- 登录态 ----
async function refreshAuth() {
  try {
    const r = await fetch('/auth/me');
    const d = await r.json();
    loggedIn = !!d.logged_in;
    if (loggedIn) {
      me = d.username;
      userLabel.textContent = me;
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      userLabel.classList.remove('hidden');
      await loadHiddenServer();
    } else {
      me = null;
      hidden.clear();
      userLabel.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      loginBtn.classList.remove('hidden');
    }
    renderList();
    updateMeta();
  } catch (e) {
    loggedIn = false;
    loginBtn.classList.remove('hidden');
  }
}

async function loadHiddenServer() {
  try {
    const r = await fetch('/preferences/hidden');
    if (!r.ok) return;
    const d = await r.json();
    hidden = new Map();
    // 名字暂未知（需 subject 名），用空，恢复区可显示 subject_id；到渲染时再从 lastData 补名
    (d.hidden || []).forEach(sid => hidden.set(sid, ''));
    // 从当前推荐列表补齐名字（便于恢复区显示）
    (lastData ? (lastData.normal || []).concat(lastData.cold || []) : []).forEach(rr => {
      if (hidden.has(rr.subject_id)) hidden.set(rr.subject_id, rr.name);
    });
  } catch (e) {}
}

async function recommend() {
  const username = q.value.trim();
  if (!username) return;
  err.classList.add('hidden');
  list.innerHTML = '';
  restore.classList.add('hidden');
  restore.innerHTML = '';
  tabs.classList.add('hidden');
  meta.textContent = '正在拉取用户数据…';
  go.disabled = true;
  exportBtn.disabled = true;
  try {
    const res = await fetch('/v1/recommend', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      // k=40：推荐池 40 部，隐藏某条后由池内下一位替补（前端显示前 20）
      body: JSON.stringify({username, k: 40})
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || `HTTP ${res.status}`);
    }
    const d = await res.json();
    lastData = d;
    activeTab = 'normal';
    // 已登录：重新从服务端拉"不感兴趣"（比上次推荐时的可能新增），并补当前列表名
    if (loggedIn) await loadHiddenServer();
    tabs.classList.remove('hidden');
    [...tabs.children].forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
    exportBtn.disabled = false;
    updateMeta();
    renderList();
  } catch (e) {
    err.classList.remove('hidden');
    err.textContent = e.message;
    meta.textContent = '';
  } finally {
    go.disabled = false;
  }
}

// 当前 tab 对应的推荐池（40 条，来自 API；前端保持"哑"）
function allRecs() {
  if (!lastData) return [];
  return activeTab === 'cold' ? (lastData.cold || []) : (lastData.normal || []);
}

// 当前查看的是不是登录用户自己（"不感兴趣"只对自己可见/可用，不能改别人的喜好）
function viewingSelf() {
  return loggedIn && !!me && !!lastData
    && String(lastData.username).toLowerCase() === String(me).toLowerCase();
}

// 可见列表：取前 20 条；仅"查看自己"时应用"不感兴趣"过滤，隐藏后空位由池内下一位替补
function visibleRecs() {
  if (!lastData) return [];
  const pool = activeTab === 'cold' ? (lastData.cold || []) : (lastData.normal || []);
  return (viewingSelf() ? pool.filter(r => !hidden.has(r.subject_id)) : pool).slice(0, 20);
}

function renderList() {
  const self = viewingSelf();
  list.innerHTML = visibleRecs().map((r, i) => `
    <div class="card">
      <img class="cover" src="/img/${r.subject_id}" loading="lazy" alt="" onerror="this.remove()">
      <span class="rank">${i + 1}</span><span class="name">${escapeHtml(r.name ?? '')}</span>
      ${self ? `<button class="hide" data-sid="${r.subject_id}" title="不感兴趣">✕</button>` : ''}
    </div>`).join('');
  renderRestore();
}

function updateMeta() {
  if (!lastData) { meta.textContent = ''; return; }
  const d = lastData;
  let t = `${d.username} 的推荐（${activeTab === 'cold' ? '冷门发现' : '动画推荐'} ${visibleRecs().length} 条`;
  if (viewingSelf() && hidden.size) t += ` · 已隐藏 ${hidden.size} 条`;
  t += '）';
  if (d.source === 'cache') t += ' · ⚠ 本地缓存（Bangumi 暂不可达）';
  meta.textContent = t;
}

// 误操作兜底：展开"已隐藏"列表，可单项恢复 / 清空全部（仅"查看自己"时显示）
function renderRestore() {
  if (!viewingSelf() || !hidden.size) { restore.classList.add('hidden'); restore.innerHTML = ''; return; }
  restore.classList.remove('hidden');
  restore.innerHTML = `
    <h3>已隐藏 ${hidden.size} 条（不感兴趣）</h3>
    ${[...hidden].map(([sid, name]) => `
      <div class="row">
        <span>${escapeHtml(name || '未知')}</span>
        <button class="sec" data-resid="${sid}">恢复</button>
      </div>`).join('')}
    <button class="clear">清空全部</button>`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

go.addEventListener('click', recommend);
q.addEventListener('keydown', e => { if (e.key === 'Enter') recommend(); });
tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  activeTab = b.dataset.tab;
  [...tabs.children].forEach(t => t.classList.toggle('active', t === b));
  renderList();
  updateMeta();
});
// 隐藏/恢复都需登录：未登录提示"请先登录"，不修改任何内容
async function toggleHidden(sid, toHide) {
  if (!loggedIn) {
    alert('请先登录后才能隐藏/恢复动画');
    return;
  }
  try {
    const r = await fetch('/preferences/hidden/' + sid, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hidden: toHide}),
    });
    if (r.status === 401) {
      await refreshAuth();  // 会话过期：回到未登录态
      alert('登录已过期，请重新登录');
      return;
    }
    if (!r.ok) { alert('保存失败，请重试'); return; }
    if (toHide) {
      const rec = allRecs().find(x => x.subject_id === sid);
      hidden.set(sid, rec ? rec.name : '');
    } else {
      hidden.delete(sid);
    }
    updateMeta();
    renderList();
  } catch (e) { alert('网络错误，请重试'); }
}

// 隐藏（"不感兴趣"）点击 → 服务端存 → 列表过滤补位
list.addEventListener('click', e => {
  const b = e.target.closest('.hide');
  if (!b || !lastData) return;
  toggleHidden(Number(b.dataset.sid), true);
});
// 恢复：单项恢复 / 清空全部
restore.addEventListener('click', e => {
  const b = e.target.closest('[data-resid]');
  if (b) toggleHidden(Number(b.dataset.resid), false);
  else if (e.target.classList.contains('clear')) clearAllHidden();
  else return;
});

async function clearAllHidden() {
  if (!loggedIn) { alert('请先登录'); return; }
  try {
    const r = await fetch('/preferences/hidden', {method: 'DELETE'});
    if (r.status === 401) { await refreshAuth(); alert('登录已过期，请重新登录'); return; }
    if (!r.ok) { alert('清空失败，请重试'); return; }
    hidden.clear();
    updateMeta();
    renderList();
  } catch (e) { alert('网络错误，请重试'); }
}

// ---- 登录 / 退出 ----
loginBtn.addEventListener('click', () => { window.location = '/auth/login'; });
logoutBtn.addEventListener('click', async () => {
  try { await fetch('/auth/logout', {method: 'POST'}); } catch (e) {}
  window.location.reload();
});

// 页面载入：恢复登录态 + 拉"不感兴趣"；已登录则自动搜索自己的推荐
refreshAuth().then(() => {
  if (loggedIn) {
    q.value = me;
    recommend();
  }
});

/* ---- 导出 JPG（原生 canvas 手绘，零依赖） ---- */
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const COLORS = { bg:'#fff0f5', card:'#ffffff', text:'#5a4a56', sub:'#b39aa8', accent:'#f26d9d' };

function preloadImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawRoundedImage(ctx, img, x, y, w, h, r) {
  ctx.save();
  roundRect(ctx, x, y, w, h, r);
  ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let cur = '';
  for (const ch of text) {
    if (cur && ctx.measureText(cur + ch).width > maxWidth) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

function ellipsis(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
  return t + '…';
}

async function exportJpg() {
  const data = lastData;
  if (!data) return;
  const isCold = activeTab === 'cold';  // 导出当前 tab 所在区域
  const recs = visibleRecs();  // 导出当前看到的（已过滤"不感兴趣"）列表
  if (!recs || !recs.length) return;
  exportBtn.disabled = true;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const covers = await Promise.all(recs.map(r => preloadImage('/img/' + r.subject_id)));

    const W = 640, PAD = 24;
    const ROW_H = 88, GAP = 10;
    const TITLE_BOTTOM = 90, PAD_BOTTOM = 24;
    const H = TITLE_BOTTOM + recs.length * (ROW_H + GAP) - GAP + PAD_BOTTOM;

    const canvas = document.createElement('canvas');
    canvas.width = W * 2; canvas.height = H * 2;  // ×2 保证清晰
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);

    ctx.fillStyle = COLORS.bg;  // JPG 无透明，先铺满
    ctx.fillRect(0, 0, W, H);

    // 顶部标题：{用户名} 的动画推荐 / 冷门发现（按当前 tab）
    ctx.fillStyle = COLORS.text;
    ctx.font = 'bold 28px ' + FONT;
    ctx.fillText((data.username || '') + (isCold ? ' 的冷门发现' : ' 的动画推荐'), PAD, 60);

    const now = new Date();
    const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

    // 行（只保留条目：封面 + 名称，无排名/角标/卡片衬底）
    recs.forEach((r, i) => {
      const y = TITLE_BOTTOM + i * (ROW_H + GAP);
      const cx = PAD, cy = y + (ROW_H - 76) / 2;
      // 封面（失败 → 占位块 + 首字）
      if (covers[i]) {
        drawRoundedImage(ctx, covers[i], cx, cy, 56, 76, 8);
      } else {
        ctx.fillStyle = '#ffe3ee';
        roundRect(ctx, cx, cy, 56, 76, 8);
        ctx.fill();
        ctx.fillStyle = COLORS.sub;
        ctx.font = '600 20px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText((r.name || '?').charAt(0), cx + 28, cy + 48);
        ctx.textAlign = 'left';
      }
      // 名称（最多 2 行，超长省略号），垂直居中
      const nameX = cx + 56 + 14;
      const nameMax = W - PAD - nameX;
      ctx.font = 'bold 16px ' + FONT;
      const lines = wrapText(ctx, r.name || '（未知）', nameMax).slice(0, 2);
      if (lines.length === 2 && ctx.measureText(lines[1] + '…').width > nameMax) {
        lines[1] = ellipsis(ctx, lines[1], nameMax);
      }
      const midY = y + ROW_H / 2;
      ctx.fillStyle = COLORS.text;
      if (lines.length === 1) {
        ctx.fillText(lines[0], nameX, midY + 6);
      } else {
        ctx.fillText(lines[0], nameX, midY - 6);
        ctx.fillText(lines[1], nameX, midY + 24);
      }
    });

    const safeName = (data.username || 'user').replace(/[\\/:*?"<>|\s]/g, '_');
    canvas.toBlob(blob => {
      if (blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bgmlikes-' + safeName + (isCold ? '-cold' : '') + '-' + dateStr + '.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }
      exportBtn.disabled = false;
    }, 'image/jpeg', 0.92);
  } catch (e) {
    console.error('导出失败', e);
    exportBtn.disabled = false;
  }
}

exportBtn.addEventListener('click', exportJpg);

/* ---- 樱花花瓣飘落（纯装饰，pointer-events:none 不挡交互） ---- */
(function () {
  const petalsEl = document.getElementById('petals');
  if (!petalsEl) return;
  const N = 22;
  for (let i = 0; i < N; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    const dur = (7 + Math.random() * 6).toFixed(2);       // 7~13s 一片
    const size = (10 + Math.random() * 9).toFixed(1);     // 10~19px
    p.style.cssText =
      'left:' + (Math.random() * 100).toFixed(2) + '%;' +
      '--size:' + size + 'px;' +
      '--dur:' + dur + 's;' +
      '--delay:-' + (Math.random() * dur).toFixed(2) + 's;';  // 负延迟：首屏即铺满花瓣
    petalsEl.appendChild(p);
  }
})();
</script>
