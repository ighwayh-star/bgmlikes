<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bgmlikes · Bangumi 动画推荐</title>
<style>
  :root {
    --bg1: #fff0f5; --bg2: #fff8fb;
    --card: rgba(255,255,255,.72);
    --line: rgba(242,109,157,.18);
    --text: #4a3f4e; --sub: #b39aa8;
    --accent: #f26d9d; --accent-soft: #ffb3d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--text);
    font-family: "SimHei","Heiti SC","Microsoft YaHei","PingFang SC",sans-serif;
    font-size: 17px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 樱花花瓣飘落 */
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; top: -8vh; left: 0;
    width: var(--size, 14px); height: var(--size, 14px);
    background: radial-gradient(circle at 32% 32%, #ffe3f0, #ffb3d1 55%, #ff8fb8);
    border-radius: 78% 22% 76% 24% / 62% 40% 60% 38%;
    opacity: 0;
    box-shadow: 0 0 6px rgba(242,109,157,.15);
    animation: petal-fall var(--dur, 10s) linear var(--delay, 0s) infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate3d(0, -6vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .9; }
    25%  { transform: translate3d(26px, 24vh, 0) rotate(96deg); opacity: .9; }
    50%  { transform: translate3d(-20px, 50vh, 0) rotate(190deg); opacity: .85; }
    75%  { transform: translate3d(24px, 76vh, 0) rotate(286deg); opacity: .7; }
    100% { transform: translate3d(-12px, 108vh, 0) rotate(360deg); opacity: 0; }
  }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand-link {
    font-size: 26px; font-weight: 700; color: #e85f8d; letter-spacing: 1px; text-decoration: none;
    text-shadow: 0 0 18px rgba(242,109,157,.35), 0 0 34px rgba(255,179,209,.35);
  }
  .brand-link:hover { text-shadow: 0 0 22px rgba(242,109,157,.5), 0 0 40px rgba(255,179,209,.5); }
  .nav-link { font-size: 13px; color: var(--sub); text-decoration: none; }
  .nav-link:hover { color: var(--accent); }
  .nav-link.active { color: var(--accent); font-weight: 600; }
  .gh-link { color: var(--sub); display: inline-flex; align-items: center; text-decoration: none; transition: color .2s; }
  .gh-link:hover { color: var(--accent); }
  .sub { color: var(--sub); font-size: 14px; margin-top: 14px; margin-bottom: 24px; line-height: 1.6; }
  .search { display: flex; gap: 10px; }
  .searchbox { position: relative; flex: 1; }
  .searchbox .icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: #d8a7c0; fill: none; stroke-width: 2;
    stroke-linecap: round; pointer-events: none;
  }
  input {
    width: 100%; padding: 14px 18px 14px 44px; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.22); background: rgba(255,255,255,.85);
    color: var(--text); font-size: 16px; outline: none;
    box-shadow: 0 2px 10px rgba(242,109,157,.08);
    transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #cbaec0; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(242,109,157,.12), 0 4px 14px rgba(242,109,157,.12); }
  button {
    padding: 14px 24px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--accent-soft) 0%, var(--accent) 100%);
    color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(242,109,157,.28);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(242,109,157,.4); filter: brightness(1.04); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.sec { background: rgba(255,255,255,.75); border: 1px solid rgba(242,109,157,.28); color: var(--accent); box-shadow: none; }
  .meta { color: var(--sub); font-size: 14px; margin-top: 18px; min-height: 20px; }
  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 20px; padding: 14px 18px; margin-top: 14px;
    cursor: pointer;  /* 点击卡片开详情浮窗 */
    box-shadow: 0 6px 22px rgba(242,109,157,.10), 0 2px 8px rgba(242,109,157,.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(242,109,157,.18); }
  .cover {
    width: 56px; height: 76px; object-fit: cover; border-radius: 10px;
    background: #ffe9f2; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(242,109,157,.18);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover .cover { transform: scale(1.07); box-shadow: 0 4px 14px rgba(242,109,157,.28); }
  .card .rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: 0 2px 6px rgba(242,109,157,.35);
    margin-right: 8px; vertical-align: middle; flex-shrink: 0;
  }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .card .tags { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .card .rate { font-size: 12px; font-weight: 700; color: #e8a33d; letter-spacing: .3px; }
  .card .rate::before { content: "⭐"; font-size: 11px; margin-right: 2px; }
  .card .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .card .badge.hot { background: rgba(242,109,157,.14); color: var(--accent); border: 1px solid rgba(242,109,157,.32); }
  .card .hide {
    flex-shrink: 0; width: 30px; height: 30px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(242,109,157,.22);
    background: rgba(255,255,255,.6); color: var(--sub);
    font-size: 14px; line-height: 1; cursor: pointer; opacity: .6; box-shadow: none;
  }
  .card .hide:hover { opacity: 1; color: var(--accent); border-color: rgba(242,109,157,.5); background: rgba(255,179,209,.25); }
  /* 条目右侧外链：Bangumi 条目页 / Bilibili 搜索 */
  .card .links { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .card .link {
    display: inline-flex; align-items: center; justify-content: center;
    height: 30px; padding: 0 8px; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.22); background: rgba(255,255,255,.6);
    font-size: 12px; font-weight: 600; text-decoration: none;
    opacity: .8; transition: opacity .15s, transform .15s, background .15s;
  }
  .card .link-ico { width: 18px; height: 18px; border-radius: 4px; display: block; }
  .card .link-txt { display: none; }
  .card .link.no-ico .link-txt { display: inline; }
  .card .link:hover { opacity: 1; transform: translateY(-1px); }
  .card .link-bgm { color: #7c8cf8; border-color: rgba(124,140,248,.32); }
  .card .link-bgm:hover { background: rgba(124,140,248,.12); }
  .card .link-bili { color: #fb7299; border-color: rgba(251,114,153,.32); }
  .card .link-bili:hover { background: rgba(251,114,153,.12); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .autharea { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .autharea button { padding: 8px 14px; font-size: 13px; }
  #userlabel { color: var(--sub); font-size: 13px; }
  .shuffle-btn { padding: 8px 16px; font-size: 13px; }
  .restore {
    margin-top: 16px; border: 1px solid rgba(255,255,255,.65); border-radius: 20px;
    background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 14px 18px; box-shadow: 0 6px 22px rgba(242,109,157,.1);
  }
  .restore h3 { font-size: 13px; color: var(--sub); margin-bottom: 4px; font-weight: 600; }
  .restore .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: 14px; }
  .restore .row button { padding: 5px 12px; font-size: 12px; border-radius: 999px; background: rgba(255,255,255,.8); border: 1px solid rgba(242,109,157,.28); color: var(--accent); box-shadow: none; }
  .restore .clear { display: block; margin-top: 8px; padding: 6px 14px; font-size: 12px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(242,109,157,.25); color: var(--sub); cursor: pointer; box-shadow: none; }
  .restore .clear:hover { color: var(--accent); border-color: rgba(242,109,157,.5); }
  .err { color: #e85f8d; font-size: 14px; margin-top: 16px; }
  .hidden { display: none; }
  /* 卡片浮窗：点击卡片 → 简介 + 相似动画（2026-08-18）。overlay 在 .petals(0)/.wrap(1) 之上 */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(74,63,78,.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  /* 必须双类：.modal-overlay 定义在 .hidden 之后，单类优先级 display:flex 会覆盖 display:none，
     导致浮窗始终可见、关不掉（2026-08-18 线上 bug）。双类 (0,2,0) 压过单类 (0,1,0)。 */
  .modal-overlay.hidden { display: none; }
  .modal {
    position: relative; z-index: 1001; width: min(560px, 100%); max-height: 82vh;
    overflow-y: auto; background: #fff; border-radius: 22px;
    box-shadow: 0 18px 50px rgba(74,63,78,.35); padding: 22px 20px 20px;
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px; width: 32px; height: 32px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(242,109,157,.22); background: rgba(255,255,255,.8);
    color: var(--sub); font-size: 15px; line-height: 1; cursor: pointer; box-shadow: none;
  }
  .modal-close:hover { color: var(--accent); border-color: rgba(242,109,157,.5); }
  .modal-head { display: flex; gap: 16px; }
  .modal-cover {
    width: 120px; height: 168px; object-fit: cover; border-radius: 12px;
    background: #ffe9f2; flex-shrink: 0; box-shadow: 0 2px 10px rgba(242,109,157,.2);
  }
  .modal-title { font-size: 19px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .modal-rating { color: #e8a33d; font-weight: 700; font-size: 13px; margin-top: 4px; }
  .modal-date, .modal-sub { color: var(--sub); font-size: 13px; margin-top: 3px; }
  .modal-tag {
    display: inline-block; font-size: 11px; padding: 2px 8px; margin: 4px 4px 0 0;
    border-radius: 999px; background: rgba(242,109,157,.1); color: var(--accent);
    border: 1px solid rgba(242,109,157,.22);
  }
  .modal-section { font-size: 13px; color: var(--sub); font-weight: 700; margin: 16px 0 8px; }
  .modal-summary { font-size: 14px; line-height: 1.75; color: var(--text); white-space: pre-line; word-break: break-word; }
  .similar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .similar-item {
    display: flex; gap: 8px; align-items: center; padding: 8px;
    border: 1px solid rgba(242,109,157,.18); border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.7); transition: border-color .15s, background .15s;
  }
  .similar-item:hover { border-color: var(--accent-soft); background: rgba(255,255,255,.95); }
  .similar-item .sc { width: 38px; height: 52px; object-fit: cover; border-radius: 6px; background: #ffe9f2; flex-shrink: 0; }
  .similar-item .sc-name { font-size: 13px; overflow-wrap: anywhere; line-height: 1.3; }
  .similar-item .sc-rate { font-size: 11px; color: #e8a33d; font-weight: 700; margin-top: 2px; }
  .modal-empty { color: var(--sub); font-size: 13px; }
  /* 浮窗内 10 星打分（对齐 /rate 页）：悬浮第 k 颗高亮 1..k + 数字气泡，点击即打 */
  .modal-rate-hint { font-size: 13px; color: var(--sub); margin-top: 8px; }
  .modal-rate-hint a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .modal-rate-hint a:hover { text-decoration: underline; }
  .stars { display: flex; align-items: center; gap: 2px; margin-top: 10px; min-height: 20px; flex-wrap: wrap; }
  .star { font-size: 17px; color: #e3c4d2; cursor: pointer; line-height: 1;
    transition: transform .12s, color .12s, text-shadow .12s; user-select: none; }
  .star:hover { transform: scale(1.25); }
  .star.on { color: #f5a623; text-shadow: 0 0 6px rgba(245,166,35,.45); }
  .star-num { min-width: 18px; font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 4px; text-align: center; }
  .rated-badge { font-size: 11px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    padding: 2px 9px; border-radius: 99px; margin-left: 6px; }
  .clear-btn { font-size: 11px; font-weight: 600; padding: 2px 9px; margin-left: 6px;
    border-radius: 99px; border: 1px solid rgba(242,109,157,.28);
    background: rgba(255,255,255,.7); color: var(--sub); cursor: pointer; font-family: inherit; }
  .clear-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); background: rgba(255,179,209,.2); }
  .stars.busy { opacity: .55; pointer-events: none; }
  /* 小屏适配 */
  @media (max-width: 480px) {
    .wrap { padding: 28px 14px 60px; }
    .brand-link { font-size: 22px; }
    .card { padding: 12px 14px; }
    .cover { width: 48px; height: 66px; }
    .card .link { padding: 0 6px; }
    .modal-overlay { padding: 10px; }
    .modal { padding: 16px 14px; max-height: 86vh; }
    .modal-cover { width: 88px; height: 124px; }
    .similar-grid { grid-template-columns: repeat(2, 1fr); }
    .star { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <a class="brand-link" href="/" title="返回主页">🌸 bgmLikes</a>
      <a class="nav-link active" href="/likes">🎯 推荐系统</a>
      <a class="nav-link" href="/daily">📺 每日放送</a>
      <a class="nav-link" href="/rate">⭐ 打分</a>
    </div>
    <div id="autharea" class="autharea">
      <button id="loginbtn" class="sec hidden">登录 (Bangumi)</button>
      <span id="userlabel" class="hidden"></span>
      <button id="logoutbtn" class="sec hidden">退出</button>
      <a class="gh-link" href="https://github.com/ighwayh-star/bgmlikes" target="_blank" rel="noopener" title="项目源码 GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </div>
  <div class="sub">输入 Bangumi 用户名，获得个性化动画推荐 · <a href="https://bgm.tv" target="_blank" style="color:var(--accent)">bgm.tv</a></div>

  <div class="search">
    <div class="searchbox">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input id="q" placeholder="输入 Bangumi 用户名，获得樱花下的推荐" autocomplete="off" />
    </div>
    <button id="go">推荐</button>
    <button id="export" class="sec" disabled>导出 JPG</button>
  </div>

  <div class="meta-row">
    <div id="meta" class="meta"></div>
    <button id="shuffle" class="sec shuffle-btn hidden" title="从推荐池重新随机选 10 部">🎲 换一批</button>
  </div>
  <div id="err" class="err hidden"></div>
  <div id="list"></div>
  <div id="restore" class="restore hidden"></div>
</div>

<!-- 卡片详情浮窗（在 #list 外，内部点击不冒泡进列表委托） -->
<div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <button class="modal-close" aria-label="关闭">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const q = document.getElementById('q');
const go = document.getElementById('go');
const exportBtn = document.getElementById('export');
const loginBtn = document.getElementById('loginbtn');
const logoutBtn = document.getElementById('logoutbtn');
const userLabel = document.getElementById('userlabel');
const meta = document.getElementById('meta');
const err = document.getElementById('err');
const list = document.getElementById('list');
const restore = document.getElementById('restore');
let lastData = null;
let shown = [];              // 当前展示的 10 条（加权随机选出，非固定前 10）
let shownBefore = new Set(); // 上次展示过的 sid（sessionStorage 持久化，保证每次刷新选出不同的 20 部）
let hidden = new Map();      // sid -> name（登录后从服务端加载的"不感兴趣"）
let loggedIn = false;        // 是否已登录（隐藏功能的前提）
let me = null;               // 登录用户的 Bangumi 用户名
let rateMap = new Map();       // sid -> {state, rate}（当前登录用户打分 overlay，浮窗星形显示）

// ---- 登录态 ----
async function refreshAuth() {
  try {
    const r = await fetch('/auth/me');
    const d = await r.json();
    loggedIn = !!d.logged_in;
    if (loggedIn) {
      me = d.username;
      userLabel.textContent = me;
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      userLabel.classList.remove('hidden');
      await loadHiddenServer();
      loadRateMap();   // 打分 overlay（不 await：失败降级空星，不阻塞登录态恢复）
    } else {
      me = null;
      hidden.clear();
      rateMap = new Map();
      if (modalOpenSid && modalCache.has(modalOpenSid)) renderModal(modalCache.get(modalOpenSid));  // 登出后浮窗星区回登录链接
      userLabel.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      loginBtn.classList.remove('hidden');
    }
    renderList();
    updateMeta();
  } catch (e) {
    loggedIn = false;
    loginBtn.classList.remove('hidden');
  }
}

async function loadHiddenServer() {
  try {
    const r = await fetch('/preferences/hidden');
    if (!r.ok) return;
    const d = await r.json();
    hidden = new Map();
    // 名字暂未知（需 subject 名），用空，恢复区可显示 subject_id；到渲染时再从 lastData 补名
    (d.hidden || []).forEach(sid => hidden.set(sid, ''));
    // 从当前推荐列表补齐名字（便于恢复区显示）
    (lastData ? (lastData.normal || []) : []).forEach(rr => {
      if (hidden.has(rr.subject_id)) hidden.set(rr.subject_id, rr.name);
    });
  } catch (e) {}
}

async function recommend() {
  const username = q.value.trim();
  if (!username) return;
  err.classList.add('hidden');
  // 同用户刷新（换人/重打才真正清空）：保留当前列表避免闪烁，期间 meta 提示"刷新中"
  const sameUser = !!(lastData && lastData.username === username);
  if (!sameUser) {
    list.innerHTML = '';
    restore.classList.add('hidden');
    restore.innerHTML = '';
    exportBtn.disabled = true;
  }
  shuffleBtn.classList.add('hidden');
  meta.textContent = sameUser ? '正在刷新推荐…' : '正在拉取用户数据…';
  go.disabled = true;
  try {
    const res = await fetch('/v1/recommend', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      // k=300：一次拉 300 部候选；前端活跃池固定取前 50 条非隐藏，隐藏后由更靠后的候补顶上来（池子不缩水）
      body: JSON.stringify({username, k: 300})
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || `HTTP ${res.status}`);
    }
    const d = await res.json();
    lastData = d;
    // 已登录：重新从服务端拉"不感兴趣"（比上次推荐时的可能新增），并补当前列表名
    if (loggedIn) await loadHiddenServer();
    // 加权随机选出本页展示的 10 部：每次进入页面不同，排名越靠前出现概率越大
    resample();
    persistShown();

    exportBtn.disabled = false;
    updateMeta();
    renderList();
  } catch (e) {
    err.classList.remove('hidden');

}

// 全部候选（k=300，来自 API；前端保持"哑"，仅作查找/后备池来源）
function allRecs() {
  return lastData ? (lastData.normal || []) : [];
}

// 活跃池：候选里最靠前的 50 条非隐藏。隐藏一条后由更靠后的候补顶上来，
// 池子恒为 50（k=300 提供充足后备余量）。非本人查看时不按"不感兴趣"过滤。
function poolRecs() {
  if (!lastData) return [];
  const ranked = lastData.normal || [];
  const base = viewingSelf() ? ranked.filter(r => !hidden.has(r.subject_id)) : ranked;
  return base.slice(0, 50);
}

// 当前查看的是不是登录用户自己（"不感兴趣"只对自己可见/可用，不能改别人的喜好）
function viewingSelf() {
  return loggedIn && !!me && !!lastData
    && String(lastData.username).toLowerCase() === String(me).toLowerCase();
}

// 可见列表：已加权随机选出的 10 条（每次进入页面不同）
function visibleRecs() {
  return shown ?? [];
}

/* ---- 加权随机 10 选 ----
   从 50 条候选里无放回加权抽 10：排名越靠前权重越大（出现概率越高）；
   上次展示过的条目权重 ×0.1，保证每次批次选出的 10 部尽量不同。 */
function loadShownBefore() {
  try {
    const s = sessionStorage.getItem('bgmlikes_shown');
    if (s) shownBefore = new Set(JSON.parse(s));
  } catch (e) {}
}
loadShownBefore();

function weightedPick(pool, n) {
  const alive = pool.map((_, i) => i);   // 原始顺序索引（pool 即分数降序）
  const weights = pool.map((r, i) => {
    let w = pool.length - i;             // 第一名权重最大，最后一名为 1
    if (shownBefore.has(r.subject_id)) w *= 0.1;   // 上次出现过的概率大降 → 基本不重复
    return w;
  });
  let total = weights.reduce((a, b) => a + b, 0);
  const out = [];
  while (out.length < n && alive.length) {
    let rnd = Math.random() * total;
    let pos = alive.length - 1;
    for (let i = 0; i < alive.length; i++) {
      rnd -= weights[alive[i]];
      if (rnd <= 0) { pos = i; break; }
    }
    const pick = alive[pos];
    out.push(pool[pick]);
    alive.splice(pos, 1);
    total -= weights[pick];
  }
  return out;
}

function resample() {
  shown = weightedPick(poolRecs(), 10);
}

function persistShown() {
  try {
    sessionStorage.setItem('bgmlikes_shown', JSON.stringify([...new Set(shown.map(r => r.subject_id))]));
  } catch (e) {}
}

// 隐藏/恢复后：池子重算为前 50 条非隐藏（候补顶替），展示不足 10 时从池内加权补足
function syncHiddenList() {
  if (!lastData) return;
  const pool = poolRecs();
  const kept = shown.filter(r => !hidden.has(r.subject_id));
  const need = Math.max(0, 10 - kept.length);
  if (need > 0) {
    const rest = pool.filter(r => !kept.some(k => k.subject_id === r.subject_id));
    shown = kept.concat(weightedPick(rest, need));
  } else {
    shown = kept;
  }
}

/* ---- 导出 JPG（原生 canvas 手绘，零依赖） ---- */
const FONT = '"SimHei","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
const COLORS = { bg:'#fff0f5', card:'#ffffff', text:'#5a4a56', sub:'#b39aa8', accent:'#f26d9d' };

function preloadImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawRoundedImage(ctx, img, x, y, w, h, r) {
  ctx.save();
  roundRect(ctx, x, y, w, h, r);
  ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let cur = '';
  for (const ch of text) {
    if (cur && ctx.measureText(cur + ch).width > maxWidth) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

function ellipsis(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
  return t + '…';
}

async function exportJpg() {
  const data = lastData;
  if (!data) return;
  const recs = visibleRecs();  // 导出当前看到的（已过滤"不感兴趣"）列表
  if (!recs || !recs.length) return;
  exportBtn.disabled = true;
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const covers = await Promise.all(recs.map(r => preloadImage('/img/' + r.subject_id)));

    const W = 640, PAD = 24;
    const ROW_H = 88, GAP = 10;
    const TITLE_BOTTOM = 90, PAD_BOTTOM = 24;
    const H = TITLE_BOTTOM + recs.length * (ROW_H + GAP) - GAP + PAD_BOTTOM;

    const canvas = document.createElement('canvas');
    canvas.width = W * 2; canvas.height = H * 2;  // ×2 保证清晰
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);

    ctx.fillStyle = COLORS.bg;  // JPG 无透明，先铺满
    ctx.fillRect(0, 0, W, H);

    // 顶部标题：{用户名} 的动画推荐
    ctx.fillStyle = COLORS.text;
    ctx.font = 'bold 28px ' + FONT;
    ctx.fillText((data.username || '') + ' 的动画推荐', PAD, 60);

    const now = new Date();
    const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

    // 行（只保留条目：封面 + 名称，无排名/角标/卡片衬底）
    recs.forEach((r, i) => {
      const y = TITLE_BOTTOM + i * (ROW_H + GAP);
      const cx = PAD, cy = y + (ROW_H - 76) / 2;
      // 封面（失败 → 占位块 + 首字）
      if (covers[i]) {
        drawRoundedImage(ctx, covers[i], cx, cy, 56, 76, 8);
      } else {
        ctx.fillStyle = '#ffe3ee';
        roundRect(ctx, cx, cy, 56, 76, 8);
        ctx.fill();
        ctx.fillStyle = COLORS.sub;
        ctx.font = '600 20px ' + FONT;
        ctx.textAlign = 'center';
        ctx.fillText((r.name || '?').charAt(0), cx + 28, cy + 48);
        ctx.textAlign = 'left';
      }
      // 名称（最多 2 行，超长省略号），垂直居中
      const nameX = cx + 56 + 14;
      const nameMax = W - PAD - nameX;
      ctx.font = 'bold 16px ' + FONT;
      const lines = wrapText(ctx, r.name || '（未知）', nameMax).slice(0, 2);
      if (lines.length === 2 && ctx.measureText(lines[1] + '…').width > nameMax) {
        lines[1] = ellipsis(ctx, lines[1], nameMax);
      }
      const midY = y + ROW_H / 2;
      ctx.fillStyle = COLORS.text;
      if (lines.length === 1) {
        ctx.fillText(lines[0], nameX, midY + 6);
      } else {
        ctx.fillText(lines[0], nameX, midY - 6);
        ctx.fillText(lines[1], nameX, midY + 24);
      }
    });

    const safeName = (data.username || 'user').replace(/[\\/:*?"<>|\s]/g, '_');
    canvas.toBlob(blob => {
      if (blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bgmlikes-' + safeName + '-' + dateStr + '.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }
      exportBtn.disabled = false;
    }, 'image/jpeg', 0.92);
  } catch (e) {
    console.error('导出失败', e);
    exportBtn.disabled = false;
  }
}

exportBtn.addEventListener('click', exportJpg);

  }

// 用 rateMap 装饰浮窗星行（星形填满 + 徽标 + 清除按钮）
function decorateModalStars(row, sid) {

    if (r.status === 401 || !r.ok) return;
    const d = await r.json();
    rateMap = new Map();
    (d.items || []).forEach(it => rateMap.set(it.subject_id, {state: it.state, rate: it.rate}));

    const r = await fetch('/api/rate/' + sid, {
      method: 'PATCH',

      body: JSON.stringify({rate: value}),

    const r = await fetch('/api/rate/' + sid, {method: 'DELETE'});
    if (r.status === 401) { await refreshAuth(); alert('登录已过期，请重新登录'); return; }
    if (!r.ok) { alert('清除失败（' + r.status + '），请重试'); return; }
    // BGM 无删除收藏接口：清除 = 评分归零、保留"看过"状态（对齐站内"删除评分"）
    const cur = rateMap.get(sid);
    rateMap.set(sid, {state: (cur && cur.state) || '看过', rate: 0});
    decorateModalStars(modalBody.querySelector('.stars'), sid);
  } catch (e) { alert('网络错误，请重试'); }
  finally { setModalBusy(sid, false); }
}

async function openModal(sid) {
  modalOpenSid = sid;
  modalOverlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';        // 滚动锁
  modalOverlay.querySelector('.modal').scrollTop = 0;
  modalBody.innerHTML = '<div class="modal-empty">加载中…</div>';
  if (modalCache.has(sid)) { renderModal(modalCache.get(sid)); return; }
  try {
    const res = await fetch('/api/subject/' + sid);
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || ('HTTP ' + res.status));
    }
    const data = await res.json();
    modalCache.set(sid, data);
    if (modalCache.size > 300) modalCache.delete(modalCache.keys().next().value);  // FIFO 防长期膨胀
    if (modalOpenSid === sid) renderModal(data);   // 已被新请求替换则丢弃
  } catch (e) {
    if (modalOpenSid === sid)
      modalBody.innerHTML = '<div class="modal-empty">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

function renderModal(d) {
  const sim = (d.similar || []).map(s => `
    <div class="similar-item" data-sid="${s.subject_id}" title="查看详情">
      <img class="sc" src="/img/${s.subject_id}" loading="lazy" alt="" onerror="this.remove()">
      <div><div class="sc-name">${escapeHtml(s.name || '')}</div>
      ${s.rating ? '<div class="sc-rate">⭐ ' + s.rating.toFixed(1) + '</div>' : ''}</div>
    </div>`).join('');
  modalBody.innerHTML = `
    <div class="modal-head">
      <img class="modal-cover" src="/img/${d.subject_id}" loading="lazy" alt="" onerror="this.remove()">
      <div><div class="modal-title">${escapeHtml(d.name || '')}</div>
      ${d.rating ? '<div class="modal-rating">⭐ ' + d.rating.toFixed(1) + '</div>' : ''}
      ${d.date ? '<div class="modal-date">' + escapeHtml(d.date) + '</div>' : ''}
      ${(d.tags || []).map(t => '<span class="modal-tag">' + escapeHtml(t) + '</span>').join('')}</div>
    </div>
    ${modalStarsHtml(d.subject_id)}
    <div class="modal-section">简介</div>
    <div class="modal-summary"></div>
    <div class="modal-section">相似动画</div>
    <div class="similar-grid">${sim || '<div class="modal-empty">暂无相似</div>'}</div>`;
  // 简介用 textContent + CSS pre-line 注入（从根上防 XSS，不 innerHTML）
  modalBody.querySelector('.modal-summary').textContent = cleanSummary(d.summary || '');
  decorateModalStars(modalBody.querySelector('.stars'), d.subject_id);
}

function closeModal() {
  modalOverlay.classList.add('hidden');
  document.body.style.overflow = '';   // 解锁滚动
  modalOpenSid = null;
}

// summary 纯文本清洗：把 HTML 块级/换行标签转成 \n，剥掉残留标签与实体（BGM 简介基本是纯文本，防御性处理）
function cleanSummary(raw) {
  return String(raw || '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|li|h[1-6]|tr)>/gi, '\n')
    .replace(/<p[^>]*>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&amp;/gi, '&').replace(/&quot;/gi, '"')
    .replace(/&#0*39;/gi, "'").replace(/&#x0*27;/gi, "'");
}

// 关闭三途径：✕ 按钮 / 点遮罩 / Esc
modalOverlay.querySelector('.modal-close').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) closeModal();
});
// 星形悬浮预览（不落库，mouseout 恢复 rateMap 值）
modalBody.addEventListener('mouseover', (e) => {
  const star = e.target.closest('.star');
  if (!star) return;
  const row = star.closest('.stars');
  fillStars(row, Number(star.dataset.v));
  setNum(row, star.dataset.v);
});
modalBody.addEventListener('mouseout', (e) => {
  const row = e.target.closest('.stars');
  if (!row) return;
  if (e.relatedTarget && row.contains(e.relatedTarget)) return;  // 仍在行内移动
  const sid = Number(row.dataset.sid);
  const cur = rateMap.get(sid);
  fillStars(row, cur ? cur.rate : 0);
  setNum(row, '');
});
// 点击：清除按钮 / 星（点当前分再点=清除）/ 相似项跳转
modalBody.addEventListener('click', e => {
  const clearBtn = e.target.closest('.clear-btn');
  if (clearBtn) { e.stopPropagation(); clearRate(Number(clearBtn.closest('.stars').dataset.sid)); return; }
  const star = e.target.closest('.star');
  if (star) {
    e.stopPropagation();
    const sid = Number(star.closest('.stars').dataset.sid);
    const v = Number(star.dataset.v);
    const cur = rateMap.get(sid);
    if (cur && cur.rate === v) { clearRate(sid); return; }  // 点击当前分再点 → 清除
    rate(sid, v);
    return;
  }
  const it = e.target.closest('.similar-item');
  if (it) openModal(Number(it.dataset.sid));
});
</script>
