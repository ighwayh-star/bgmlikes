<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bgmLikes · 每日放送</title>
<style>
  :root {
    --bg1: #fff0f5; --bg2: #fff8fb;
    --card: rgba(255,255,255,.72);
    --line: rgba(242,109,157,.18);
    --text: #4a3f4e; --sub: #b39aa8;
    --accent: #f26d9d; --accent-soft: #ffb3d1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--text);
    font-family: "SimHei","Heiti SC","Microsoft YaHei","PingFang SC",sans-serif;
    min-height: 100vh;
  }
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; top: -8vh; left: 0;
    width: var(--size, 14px); height: var(--size, 14px);
    background: radial-gradient(circle at 32% 32%, #ffe3f0, #ffb3d1 55%, #ff8fb8);
    border-radius: 78% 22% 76% 24% / 62% 40% 60% 38%;
    opacity: 0;
    box-shadow: 0 0 6px rgba(242,109,157,.15);
    animation: petal-fall var(--dur, 10s) linear var(--delay, 0s) infinite;
  }
  @keyframes petal-fall {
    0%   { transform: translate3d(0, -6vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .9; }
    25%  { transform: translate3d(26px, 24vh, 0) rotate(96deg); opacity: .9; }
    50%  { transform: translate3d(-20px, 50vh, 0) rotate(190deg); opacity: .85; }
    75%  { transform: translate3d(24px, 76vh, 0) rotate(286deg); opacity: .7; }
    100% { transform: translate3d(-12px, 108vh, 0) rotate(360deg); opacity: 0; }
  }

  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 34px 20px 80px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand-link {
    font-size: 26px; font-weight: 700; color: #e85f8d; letter-spacing: 1px; text-decoration: none;
    text-shadow: 0 0 18px rgba(242,109,157,.35), 0 0 34px rgba(255,179,209,.35);
  }
  .brand-link:hover { text-shadow: 0 0 22px rgba(242,109,157,.5), 0 0 40px rgba(255,179,209,.5); }
  .nav-link { font-size: 13px; color: var(--sub); text-decoration: none; }
  .nav-link:hover { color: var(--accent); }
  .nav-link.active { color: var(--accent); font-weight: 600; }
  .gh-link { color: var(--sub); display: inline-flex; align-items: center; text-decoration: none; transition: color .2s; }
  .gh-link:hover { color: var(--accent); }
  .autharea { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  button { padding: 9px 16px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent)); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(242,109,157,.28);
    transition: transform .18s, box-shadow .18s; font-family: inherit; }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(242,109,157,.4); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.sec { background: rgba(255,255,255,.75); border: 1px solid rgba(242,109,157,.28); color: var(--accent); box-shadow: none; }
  #userlabel { color: var(--sub); font-size: 13px; }

  .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .tab { flex: 1; text-align: center; padding: 11px 0; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.2); background: #fff7fa; color: var(--accent);
    font-size: 15px; font-weight: 600; cursor: pointer; }
  .tab.active { background: linear-gradient(135deg, var(--accent-soft), var(--accent)); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(242,109,157,.3); }
  .collected-toggle { flex: 0 0 auto; margin-left: auto; padding: 9px 14px; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.28); background: rgba(255,255,255,.75); color: var(--accent);
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: background .18s, transform .18s; }
  .collected-toggle:hover { background: rgba(255,179,209,.2); }
  .collected-toggle.active { background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    border-color: transparent; color: #fff; }
  .state-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px;
    border-radius: 99px; margin-right: 6px; }
  .state--watching { color: #e85f8d; background: rgba(232,95,141,.12); }
  .state--watched { color: #7c8fa6; background: rgba(124,143,166,.14); }
  .state--want { color: #4d96ff; background: rgba(77,150,255,.12); }
  .state--hold { color: #e8a87c; background: rgba(232,168,124,.16); }

  .meta { color: var(--sub); font-size: 14px; margin-bottom: 12px; min-height: 20px; }
  .err { color: #e85f8d; font-size: 14px; margin-bottom: 12px; }

  .card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 20px; padding: 14px 18px; margin-bottom: 10px;
    cursor: pointer;  /* 点击卡片开详情浮窗 */
    box-shadow: 0 6px 22px rgba(242,109,157,.10), 0 2px 8px rgba(242,109,157,.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform .18s ease, box-shadow .18s ease, opacity .18s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(242,109,157,.18); }
  .card.hidden-card { opacity: .45; filter: grayscale(.3); }
.card--checked { border-color: var(--accent); background: rgba(255,179,209,.22); }
  .cover {
    width: 56px; height: 76px; object-fit: cover; border-radius: 10px;
    background: #ffe9f2; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(242,109,157,.18);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover .cover { transform: scale(1.07); box-shadow: 0 4px 14px rgba(242,109,157,.28); }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .name-ja { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .card .tags { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .card .rate { font-size: 12px; font-weight: 700; color: #e8a33d; letter-spacing: .3px; }
  .card .rate::before { content: "⭐"; font-size: 11px; margin-right: 2px; }
  /* 条目右侧外链：Bangumi 条目页 / Bilibili 搜索 */
  .card .links { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .card .link {
    display: inline-flex; align-items: center; justify-content: center;
    height: 30px; padding: 0 8px; border-radius: 999px;
    border: 1px solid rgba(242,109,157,.22); background: rgba(255,255,255,.6);
    font-size: 12px; font-weight: 600; text-decoration: none;
    opacity: .8; transition: opacity .15s, transform .15s, background .15s;
  }
  .card .link-ico { width: 18px; height: 18px; border-radius: 4px; display: block; }
  .card .link-txt { display: none; }
  .card .link.no-ico .link-txt { display: inline; }
  .card .link:hover { opacity: 1; transform: translateY(-1px); }
  .card .link-bgm { color: #7c8cf8; border-color: rgba(124,140,248,.32); }
  .card .link-bgm:hover { background: rgba(124,140,248,.12); }
  .card .link-bili { color: #fb7299; border-color: rgba(251,114,153,.32); }
  .card .link-bili:hover { background: rgba(251,114,153,.12); }
  .card .hide {
    flex-shrink: 0; width: 30px; height: 30px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(242,109,157,.22);
    background: rgba(255,255,255,.6); color: var(--sub);
    font-size: 14px; line-height: 1; cursor: pointer; opacity: .6; box-shadow: none;
  }
  .card .hide:hover { opacity: 1; color: var(--accent); border-color: rgba(242,109,157,.5); background: rgba(255,179,209,.25); }

  .day-sec { margin-bottom: 18px; }
  .day-head { display: flex; align-items: center; gap: 8px; padding: 8px 2px 6px; font-weight: 700; font-size: 17px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot--1{background:#F8829E}.dot--2{background:#E8A87C}.dot--3{background:#F5C842}.dot--4{background:#6BCB77}.dot--5{background:#4D96FF}.dot--6{background:#9B72F2}.dot--7{background:#F07080}
  .day-count { font-size: 13px; color: var(--sub); font-weight: 500; }
  .new-badge { font-size: 10px; color: #E8688A; background: rgba(232,104,138,.1); padding: 1px 6px; border-radius: 99px; }

  .hidden-sec { margin-top: 8px; border-top: 1px solid rgba(242,109,157,.1); padding-top: 8px; }
  .hidden-head { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--sub); }
  .footer { padding: 10px 2px 16px; text-align: center; font-size: 13px; color: var(--sub); }
  .footer a { color: var(--accent); text-decoration: none; }
  .season-bar { display: flex; align-items: center; gap: 8px; padding: 4px 2px 12px; flex-wrap: wrap; }
  .season-bar button { font-size: 13px; padding: 7px 14px; }
  .empty { text-align: center; color: var(--sub); padding: 28px 0; font-size: 15px; }
  .hidden { display: none; }
  .login-hint { font-size: 13px; color: var(--sub); margin-bottom: 12px; text-align: center; }
  .login-hint a { color: var(--accent); }
  /* 卡片浮窗：点击卡片 → 简介 + 相似动画 + 10 星打分 */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(74,63,78,.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  /* 必须双类：.modal-overlay 定义在 .hidden 之后，单类优先级 display:flex 会覆盖 display:none，
     导致浮窗始终可见、关不掉。双类 (0,2,0) 压过单类 (0,1,0)。 */
  .modal-overlay.hidden { display: none; }
  .modal {
    position: relative; z-index: 1001; width: min(560px, 100%); max-height: 82vh;
    overflow-y: auto; background: #fff; border-radius: 22px;
    box-shadow: 0 18px 50px rgba(74,63,78,.35); padding: 22px 20px 20px;
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px; width: 32px; height: 32px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(242,109,157,.22); background: rgba(255,255,255,.8);
    color: var(--sub); font-size: 15px; line-height: 1; cursor: pointer; box-shadow: none;
  }
  .modal-close:hover { color: var(--accent); border-color: rgba(242,109,157,.5); }
  .modal-head { display: flex; gap: 16px; }
  .modal-cover {
    width: 120px; height: 168px; object-fit: cover; border-radius: 12px;
    background: #ffe9f2; flex-shrink: 0; box-shadow: 0 2px 10px rgba(242,109,157,.2);
  }
  .modal-title { font-size: 19px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .modal-rating { color: #e8a33d; font-weight: 700; font-size: 13px; margin-top: 4px; }
  .modal-date, .modal-sub { color: var(--sub); font-size: 13px; margin-top: 3px; }
  .modal-tag {
    display: inline-block; font-size: 11px; padding: 2px 8px; margin: 4px 4px 0 0;
    border-radius: 999px; background: rgba(242,109,157,.1); color: var(--accent);
    border: 1px solid rgba(242,109,157,.22);
  }
  .modal-section { font-size: 13px; color: var(--sub); font-weight: 700; margin: 16px 0 8px; }
  .modal-summary { font-size: 14px; line-height: 1.75; color: var(--text); white-space: pre-line; word-break: break-word; }
  .similar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .similar-item {
    display: flex; gap: 8px; align-items: center; padding: 8px;
    border: 1px solid rgba(242,109,157,.18); border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.7); transition: border-color .15s, background .15s;
  }
  .similar-item:hover { border-color: var(--accent-soft); background: rgba(255,255,255,.95); }
  .similar-item .sc { width: 38px; height: 52px; object-fit: cover; border-radius: 6px; background: #ffe9f2; flex-shrink: 0; }
  .similar-item .sc-name { font-size: 13px; overflow-wrap: anywhere; line-height: 1.3; }
  .similar-item .sc-rate { font-size: 11px; color: #e8a33d; font-weight: 700; margin-top: 2px; }
  .modal-empty { color: var(--sub); font-size: 13px; }
  /* 浮窗内 10 星打分（对齐 /rate 页）：悬浮第 k 颗高亮 1..k + 数字气泡，点击即打 */
  .modal-rate-hint { font-size: 13px; color: var(--sub); margin-top: 8px; }
  .modal-rate-hint a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .modal-rate-hint a:hover { text-decoration: underline; }
  .stars { display: flex; align-items: center; gap: 2px; margin-top: 10px; min-height: 20px; flex-wrap: wrap; }
  .star { font-size: 17px; color: #e3c4d2; cursor: pointer; line-height: 1;
    transition: transform .12s, color .12s, text-shadow .12s; user-select: none; }
  .star:hover { transform: scale(1.25); }
  .star.on { color: #f5a623; text-shadow: 0 0 6px rgba(245,166,35,.45); }
  .star-num { min-width: 18px; font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 4px; text-align: center; }
  .rated-badge { font-size: 11px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    padding: 2px 9px; border-radius: 99px; margin-left: 6px; }
  .clear-btn { font-size: 11px; font-weight: 600; padding: 2px 9px; margin-left: 6px;
    border-radius: 99px; border: 1px solid rgba(242,109,157,.28);
    background: rgba(255,255,255,.7); color: var(--sub); cursor: pointer; font-family: inherit; }
  .clear-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); background: rgba(255,179,209,.2); }
  .stars.busy { opacity: .55; pointer-events: none; }
  @media (max-width: 480px) {
    .wrap { padding: 24px 14px 60px; }
    .brand-link { font-size: 22px; }
    .card { padding: 12px 14px; }
    .cover { width: 48px; height: 66px; }
    .card .link { padding: 0 6px; }
    .star { font-size: 15px; }
    .modal-overlay { padding: 10px; }
    .modal { padding: 16px 14px; max-height: 86vh; }
    .modal-cover { width: 88px; height: 124px; }
    .similar-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <a class="brand-link" href="/" title="返回主页">🌸 bgmLikes</a>
      <a class="nav-link" href="/likes">🎯 推荐系统</a>
      <a class="nav-link active" href="/daily">📺 每日放送</a>
      <a class="nav-link" href="/rate">⭐ 打分</a>
    </div>
    <div id="autharea" class="autharea">
      <button id="loginbtn" class="sec hidden">登录 (Bangumi)</button>
      <span id="userlabel" class="hidden"></span>
      <button id="logoutbtn" class="sec hidden">退出</button>
      <a class="gh-link" href="https://github.com/ighwayh-star/bgmlikes" target="_blank" rel="noopener" title="项目源码 GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </div>

  <div id="meta" class="meta"></div>
  <div class="tabs">
    <div id="tabDaily" class="tab active">每日</div>
    <div id="tabSeason" class="tab">本季全览</div>
    <button id="collectedToggle" class="collected-toggle hidden" title="只显示我收藏中的番（在看/看过/想看/搁置）">👁 只看我的</button>
  </div>
  <div id="loginHint" class="login-hint hidden">登录后可在每日放送中隐藏不喜欢的新番</div>
  <div id="err" class="err hidden"></div>
  <div id="content"></div>
  <div class="footer">数据来源 <a href="https://bgm.tv" target="_blank" rel="noopener">Bangumi</a></div>
</div>

<!-- 卡片详情浮窗（在 .wrap 外，内部点击不冒泡进内容区委托） -->
<div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <button class="modal-close" aria-label="关闭">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
'use strict';

// ---- 元素 & 状态 ----
const loginBtn = document.getElementById('loginbtn');
const logoutBtn = document.getElementById('logoutbtn');
const userLabel = document.getElementById('userlabel');
const meta = document.getElementById('meta');
const err = document.getElementById('err');
const content = document.getElementById('content');
const tabDaily = document.getElementById('tabDaily');
const tabSeason = document.getElementById('tabSeason');
const loginHint = document.getElementById('loginHint');
const collectedToggle = document.getElementById('collectedToggle');

let calendarData = null;   // 放送表（7 天）
let hiddenIds = [];        // 已隐藏的 subject 集合（登录后从服务端拉取）
let collectedIds = null;   // 登录用户收藏集合（Set<subject_id>，在看/看过/想看/搁置）；null = 未知/拉取失败
let collectedState = new Map();  // subject_id -> 状态名（卡片标签用）
let collectedOnly = false; // 「只看我的」筛选开关
let loggedIn = false;
let me = null;
let tab = 'daily';         // 'daily' | 'season'
let selectMode = false;
let selectedIds = new Set();
let rateMap = new Map();       // sid -> {state, rate}（当前登录用户打分 overlay，浮窗星形显示）

// ---- 星期换算（Bangumi weekday.id: 1=周一..7=周日；JS getDay: 0=周日..6=周六）----
function jsDayToBangumi(jsDay) { return jsDay === 0 ? 7 : jsDay; }
function getTodayId() { return jsDayToBangumi(new Date().getDay()); }
function getYesterdayId() { const t = getTodayId(); return t === 1 ? 7 : t - 1; }
const WEEKDAY_NAMES = { 1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六',7:'周日' };
function formatDateShort(d) { return (d.getMonth()+1) + '月' + d.getDate() + '日'; }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- 数据归一化（同 dm normalizeAnimeItem）----
function normalizeAnime(item) {
  return {
    id: item.id,
    name: item.name || '',
    nameCn: item.name_cn || item.name || '',
    images: item.images || {},
    rating: item.rating || { score: 0, total: 0 },
    url: item.url || 'https://bgm.tv/subject/' + item.id,
  };
}
function getByWeekday(data, weekdayId) {
  const day = (data || []).find(d => d.weekday && d.weekday.id === weekdayId);
  return (day && day.items || []).map(normalizeAnime);
}

// ---- 登录态 ----
async function refreshAuth() {
  try {
    const r = await fetch('/auth/me');
    const d = await r.json();
    loggedIn = !!d.logged_in;
    if (loggedIn) {
      me = d.username;
      userLabel.textContent = me;
      userLabel.classList.remove('hidden');
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      await loadHidden();
      loadCollected();  // 不阻塞日历加载：完成后自行刷新登录UI/渲染
      loadRateMap();    // 打分 overlay（不 await：失败降级空星，不阻塞登录态恢复）
    } else {
      me = null; hiddenIds = [];
      collectedIds = null; collectedOnly = false; collectedState = new Map();
      rateMap = new Map();
      if (modalOpenSid && modalCache.has(modalOpenSid)) renderModal(modalCache.get(modalOpenSid));  // 登出后浮窗星区回登录链接
      userLabel.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      loginBtn.classList.remove('hidden');
    }
    refreshLoginUI();
    render();
  } catch (e) {
    loggedIn = false; me = null;
    loginBtn.classList.remove('hidden');
    refreshLoginUI();
  }
}

function refreshLoginUI() {
  loginHint.classList.toggle('hidden', loggedIn);
  const usable = loggedIn && !!collectedIds;
  if (!usable) collectedOnly = false;
  collectedToggle.classList.toggle('hidden', !usable);
  collectedToggle.classList.toggle('active', collectedOnly);
}

async function loadHidden() {
  try {
    const r = await fetch('/daily/hidden');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    hiddenIds = d.hidden || [];
  } catch (e) { hiddenIds = []; }
}

// 登录用户的收藏状态（在看/看过/想看/搁置）；本季判定：前端与放送表 calendar 取交集
async function loadCollected() {
  collectedIds = null; collectedState = new Map();
  try {
    const r = await fetch('/daily/collected');
    if (!r.ok) return;
    const d = await r.json();
    const ids = new Set(); const st = new Map();
    (d.items || []).forEach(it => { ids.add(Number(it.id)); st.set(Number(it.id), it.state); });
    collectedIds = ids; collectedState = st;
  } catch (e) { collectedIds = null; }
  refreshLoginUI();
  render();
}

// ---- 隐藏 / 取消隐藏（需登录）----
async function toggleHide(id) {
  if (!loggedIn) { alert('请先登录后再隐藏新番'); return; }
  const toHide = !hiddenIds.includes(id);
  try {
    const r = await fetch('/daily/hidden/' + id, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hidden: toHide}),
    });
    if (r.status === 401) {
      await refreshAuth();
      alert('登录已过期，请重新登录');
      return;
    }
    if (!r.ok) { alert('保存失败，请重试'); return; }
    if (toHide) hiddenIds.push(id); else hiddenIds = hiddenIds.filter(x => x !== id);
    render();
  } catch (e) { alert('网络错误，请重试'); }
}

// ---- 数据加载（经服务端代理 /api/calendar，避 CORS）----
async function loadData(force) {
  meta.textContent = '加载中…';
  err.classList.add('hidden');
  try {
    let data = null;
    if (!force) {
      try {
        const cached = sessionStorage.getItem('bgmlikes_calendar');
        if (cached) { const c = JSON.parse(cached); if (Date.now() - c.t < 60*60*1000) data = c.data; }
      } catch (e) {}
    }
    if (!data) {
      const r = await fetch('/api/calendar');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
      try { sessionStorage.setItem('bgmlikes_calendar', JSON.stringify({t: Date.now(), data})); } catch (e) {}
    }
    if (!Array.isArray(data)) throw new Error('数据格式异常');
    calendarData = data;
    meta.textContent = '';
    render();
  } catch (e) {
    err.classList.remove('hidden');
    err.textContent = '加载失败：' + (e.message || e) + '，请重试';
    meta.textContent = '';
  }
}

// 「只看我的」：开关开启且收藏集合可用时才过滤
function showIfCollected(id) { return !collectedOnly || (collectedIds && collectedIds.has(Number(id))); }

const STATE_CLS = { '在看':'watching', '看过':'watched', '想看':'want', '搁置':'hold' };
function stateTag(id) {
  if (!collectedState || !collectedState.has(Number(id))) return '';
  const st = collectedState.get(Number(id));
  return '<span class="state-tag state--' + (STATE_CLS[st] || 'other') + '">' + escapeHtml(st) + '</span>';
}

function renderDaily() {
  const todayId = getTodayId();
  const yesterdayId = getYesterdayId();
  const todayRaw = getByWeekday(calendarData, todayId);
  const yesterdayRaw = getByWeekday(calendarData, yesterdayId);
  const filter = a => !hiddenIds.includes(a.id) && showIfCollected(a.id);
  const todayVis = todayRaw.filter(filter);
  const yesterdayVis = yesterdayRaw.filter(filter);
  const todayHid = todayRaw.filter(a => hiddenIds.includes(a.id));
  const yesterdayHid = yesterdayRaw.filter(a => hiddenIds.includes(a.id));

  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);

  let html = '';
  html += makeDaySection('昨天', yesterdayId, yesterdayVis, formatDateShort(yesterday), false);
  html += makeDaySection('今天', todayId, todayVis, formatDateShort(today), true);

  const allHidden = [...todayHid, ...yesterdayHid];
  if (allHidden.length > 0) {
    html += '<div class="hidden-sec">';
    html += '<div class="hidden-head">已隐藏 (' + allHidden.length + ')</div>';
    html += '<div style="margin-top:6px">' + allHidden.map(a => makeCard(a, true)).join('') + '</div>';
    html += '</div>';
  }

  if (!html) html = '<div class="empty">' + (collectedOnly ? '今天没有我收藏的番' : '今天暂无放送') + '</div>';
  content.innerHTML = html;
  bindCardEvents(content);
}

function makeDaySection(title, weekdayId, items, dateStr, isToday) {
  if (items.length === 0) return '';
  return '<div class="day-sec"><div class="day-head">' +
    '<span class="dot dot--' + weekdayId + '"></span>' +
    title + ' ' + (WEEKDAY_NAMES[weekdayId] || '') + ' · ' + dateStr +
    (isToday ? ' <span class="new-badge">NEW</span>' : '') +
    ' <span class="day-count">' + items.length + '部</span></div>' +
    '<div>' + items.map(a => makeCard(a, false)).join('') + '</div></div>';
}

// 封面回退链：/img/{id} 失败 → BGM 直连图（grid/small）→ 再失败移除 <img>
function coverFallback(id, cover) {
  const src = String(cover).replace(/['\\]/g, '');
  return src
    ? 'onerror="this.onerror=null;this.src=\'' + src + '\';this.onerror=function(){this.remove()}"'
    : 'onerror="this.onerror=null;this.remove()"';
}

function makeCard(anime, isHidden) {
  const id = anime.id;
  const score = anime.rating && anime.rating.score ? anime.rating.score.toFixed(1) : '';
  const cover = (anime.images && (anime.images.grid || anime.images.small)) || '';
  const cls = isHidden ? ' hidden-card' : '';
  const hideTitle = isHidden ? '恢复显示' : '隐藏';
  return '<div class="card' + cls + '" data-sid="' + id + '" title="点击查看详情">' +
    '<img class="cover" src="/img/' + id + '" loading="lazy" alt="" ' + coverFallback(id, cover) + '>' +
    '<div class="info">' +
      '<div class="name">' + escapeHtml(anime.nameCn) + '</div>' +
      (anime.name && anime.name !== anime.nameCn ? '<div class="name-ja">' + escapeHtml(anime.name) + '</div>' : '') +
      '<div class="tags">' + stateTag(id) + (score ? '<span class="rate">' + score + '</span>' : '') + '</div>' +
    '</div>' +
    '<div class="links">' +
      '<a class="link link-bgm" href="https://bgm.tv/subject/' + id + '" target="_blank" rel="noopener" title="在 Bangumi 打开条目">' +
        '<img class="link-ico" src="' + BGM_ICO + '" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add(\'no-ico\')"><span class="link-txt">BGM</span></a>' +

        '<img class="link-ico" src="https://www.bilibili.com/favicon.ico" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add(\'no-ico\')"><span class="link-txt">B站</span></a>' +

}

function bindCardEvents(container) {
  container.querySelectorAll('.card').forEach(card => {
    const id = parseInt(card.dataset.sid);
    card.onclick = (e) => {
      if (e.target.closest('[data-action]')) return;   // ✕ 隐藏按钮
      if (e.target.closest('a.link')) return;          // BGM/B站 外链照常新标签打开
      if (selectMode) {
        selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
        card.classList.toggle('card--checked', selectedIds.has(id));
        updateSeasonBar();
      } else {
        openModal(id);   // 点卡片 → 简介浮窗
      }
    };
    const hideBtn = card.querySelector('[data-action="hide"]');
    if (hideBtn) hideBtn.onclick = (e) => {
      e.stopPropagation();
      toggleHide(id);
    };
  });
}

// ---- 本季全览 ----
function renderSeason() {
  const barHTML = selectMode
    ? '<div class="season-bar">' +
        '<span style="font-size:13px;color:var(--sub)">已选 <b>' + selectedIds.size + '</b> 部</span>' +
        '<button class="sec" onclick="void(0)" data-sel="visible">选中未隐藏</button>' +
        '<button class="sec" onclick="void(0)" data-sel="hidden">选中已隐藏</button>' +
        '<button class="sec" onclick="void(0)" data-sel="hide" disabled>隐藏选中</button>' +
        '<button class="sec" onclick="void(0)" data-sel="unhide" disabled>取消隐藏</button>' +
        '<button class="sec" onclick="void(0)" data-sel="exit">退出选择</button>' +
      '</div>'
    : '<div class="season-bar"><button onclick="void(0)" data-sel="enter">📋 选择模式（批量隐藏）</button></div>';

  let html = barHTML;
  (calendarData || []).forEach(day => {
    const wd = day.weekday;
    if (!wd || !day.items || day.items.length === 0) return;
    const vis = day.items.filter(a => !hiddenIds.includes(a.id) && showIfCollected(a.id));
    const hid = day.items.filter(a => hiddenIds.includes(a.id) && showIfCollected(a.id));
    const all = [...vis, ...hid];
    if (all.length === 0) return;
    html += '<div class="day-sec"><div class="day-head">' +
      '<span class="dot dot--' + wd.id + '"></span>' +
      (WEEKDAY_NAMES[wd.id] || wd.cn || '') +
      ' <span class="day-count">' + all.length + '部</span></div>' +
      '<div>' + all.map(a => makeCard(normalizeAnime(a), hiddenIds.includes(a.id))).join('') + '</div></div>';
  });
  if (!(calendarData || []).some(d => d.items && d.items.length)) html += '<div class="empty">本季暂无放送</div>';
  content.innerHTML = html;
  bindCardEvents(content);
  bindSeasonEvents(content);
}

function bindSeasonEvents(container) {
  const click = (sel, fn) => {
    const b = container.querySelector('[data-sel="' + sel + '"]');
    if (b) b.onclick = fn;
  };
  click('enter', () => { selectMode = true; selectedIds.clear(); render(); });
  click('exit', () => { selectMode = false; selectedIds.clear(); render(); });
  click('visible', () => {
    container.querySelectorAll('.card:not(.hidden-card)').forEach(c => selectedIds.add(parseInt(c.dataset.sid)));
    render();
  });
  click('hidden', () => {
    container.querySelectorAll('.card.hidden-card').forEach(c => selectedIds.add(parseInt(c.dataset.sid)));
    render();
  });
  click('hide', () => bulkHide());
  click('unhide', () => bulkUnhide());
  updateSeasonBar();
}

function updateSeasonBar() {
  const hiddenCount = [...selectedIds].filter(id => hiddenIds.includes(id)).length;
  const visCount = selectedIds.size - hiddenCount;
  const hideBtn = content.querySelector('[data-sel="hide"]');
  const unhideBtn = content.querySelector('[data-sel="unhide"]');
  if (hideBtn) hideBtn.disabled = visCount === 0;
  if (unhideBtn) unhideBtn.disabled = hiddenCount === 0;
  const b = content.querySelector('.season-bar b');
  if (b) b.textContent = selectedIds.size;
}

async function bulkHide() {
  const toHide = [...selectedIds].filter(id => !hiddenIds.includes(id));
  let failed = false;
  for (const id of toHide) {
    try {
      const r = await fetch('/daily/hidden/' + id, { method: 'POST',
        headers: {'Content-Type':'application/json'}, body: JSON.stringify({hidden:true}) });
      if (r.status === 401) { await refreshAuth(); alert('登录已过期'); return; }
      if (!r.ok) { failed = true; continue; }
      if (!hiddenIds.includes(id)) hiddenIds.push(id);
    } catch (e) { failed = true; }
  }
  selectedIds.clear();
  if (failed) alert('部分保存失败，请重试');
  render();
}

async function bulkUnhide() {
  const toUnhide = [...selectedIds].filter(id => hiddenIds.includes(id));
  let failed = false;
  for (const id of toUnhide) {
    try {
      const r = await fetch('/daily/hidden/' + id, { method: 'POST',
        headers: {'Content-Type':'application/json'}, body: JSON.stringify({hidden:false}) });
      if (r.status === 401) { await refreshAuth(); alert('登录已过期'); return; }
      if (!r.ok) { failed = true; continue; }
      hiddenIds = hiddenIds.filter(x => x !== id);
    } catch (e) { failed = true; }
  }
  selectedIds.clear();
  if (failed) alert('部分保存失败，请重试');
  render();
}

/* ---- 卡片详情浮窗：简介 + 相似动画 + 10 星打分 ---- */
const modalOverlay = document.getElementById('modal');
const modalBody = document.getElementById('modal-body');
const modalCache = new Map();   // sid -> /api/subject/{id} 响应（同一条目只拉一次）
let modalOpenSid = null;        // 竞态守卫：连续快点点两张卡，旧请求晚到不覆盖新内容

async function openModal(sid) {
  modalOpenSid = sid;
  modalOverlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';        // 滚动锁
  modalOverlay.querySelector('.modal').scrollTop = 0;
  modalBody.innerHTML = '<div class="modal-empty">加载中…</div>';
  if (modalCache.has(sid)) { renderModal(modalCache.get(sid)); return; }
  try {
    const res = await fetch('/api/subject/' + sid);
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || ('HTTP ' + res.status));
    }
    const data = await res.json();
    modalCache.set(sid, data);
    if (modalCache.size > 300) modalCache.delete(modalCache.keys().next().value);  // FIFO 防长期膨胀
    if (modalOpenSid === sid) renderModal(data);   // 已被新请求替换则丢弃
  } catch (e) {
    if (modalOpenSid === sid)
      modalBody.innerHTML = '<div class="modal-empty">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

function renderModal(d) {
  const sim = (d.similar || []).map(s => `
    <div class="similar-item" data-sid="${s.subject_id}" title="查看详情">
      <img class="sc" src="/img/${s.subject_id}" loading="lazy" alt="" onerror="this.remove()">
      <div><div class="sc-name">${escapeHtml(s.name || '')}</div>
      ${s.rating ? '<div class="sc-rate">⭐ ' + s.rating.toFixed(1) + '</div>' : ''}</div>
    </div>`).join('');
  modalBody.innerHTML = `
    <div class="modal-head">
      <img class="modal-cover" src="/img/${d.subject_id}" loading="lazy" alt="" onerror="this.remove()">
      <div><div class="modal-title">${escapeHtml(d.name || '')}</div>
      ${d.rating ? '<div class="modal-rating">⭐ ' + d.rating.toFixed(1) + '</div>' : ''}
      ${d.date ? '<div class="modal-date">' + escapeHtml(d.date) + '</div>' : ''}
      ${(d.tags || []).map(t => '<span class="modal-tag">' + escapeHtml(t) + '</span>').join('')}</div>
    </div>
    ${modalStarsHtml(d.subject_id)}
    <div class="modal-section">简介</div>
    <div class="modal-summary"></div>
    <div class="modal-section">相似动画</div>
    <div class="similar-grid">${sim || '<div class="modal-empty">暂无相似</div>'}</div>`;
  // 简介用 textContent + CSS pre-line 注入（从根上防 XSS，不 innerHTML）
  modalBody.querySelector('.modal-summary').textContent = cleanSummary(d.summary || '');
  decorateModalStars(modalBody.querySelector('.stars'), d.subject_id);
}

function closeModal() {
  modalOverlay.classList.add('hidden');
  document.body.style.overflow = '';   // 解锁滚动
  modalOpenSid = null;
}

// summary 纯文本清洗（同 index.html）：块级/换行标签转 \n，剥掉残留标签与实体
function cleanSummary(raw) {
  return String(raw || '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|li|h[1-6]|tr)>/gi, '\n')
    .replace(/<p[^>]*>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&amp;/gi, '&').replace(/&quot;/gi, '"')
    .replace(/&#0*39;/gi, "'").replace(/&#x0*27;/gi, "'");
}

// 关闭三途径：✕ 按钮 / 点遮罩 / Esc
modalOverlay.querySelector('.modal-close').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) closeModal();
});

// ---- 浮窗内 10 星打分（对齐 /rate 页语义；写用户真实 BGM 账号）----
function fillStars(row, v) {
  if (!row) return;
  row.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('on', Number(s.dataset.v) <= v);
  });
}
function setNum(row, text) {
  if (!row) return;
  const n = row.querySelector('.star-num');
  if (n) n.textContent = text;
}

// 星形行 HTML：未登录 → 登录链接（浮窗仍可看简介）；登录 → 10 星 + 数字 + 徽标 + 清除
function modalStarsHtml(sid) {
  if (!loggedIn) {
    return '<div class="modal-rate-hint">🔒 <a href="/auth/login">登录后可打分</a></div>';
  }
  let h = '<div class="stars" data-sid="' + sid + '">';
  for (let i = 1; i <= 10; i++) h += '<span class="star" data-v="' + i + '" title="' + i + ' 分">★</span>';
  h += '<span class="star-num"></span>' +
       '<span class="rated-badge hidden"></span>' +
       '<button class="clear-btn hidden" title="清除评分（保留看过状态）">✕ 清除评分</button>' +
       '</div>';
  return h;
}

// 用 rateMap 装饰浮窗星行（星形填满 + 徽标 + 清除按钮）
function decorateModalStars(row, sid) {
  if (!row) return;
  const cur = rateMap.get(sid);
  const v = cur ? cur.rate : 0;
  fillStars(row, v);
  setNum(row, '');
  const badge = row.querySelector('.rated-badge');
  const clearBtn = row.querySelector('.clear-btn');
  if (cur && cur.rate > 0) {
    badge.textContent = '看过 ' + cur.rate + '分';
    badge.classList.remove('hidden');
    clearBtn.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
    clearBtn.classList.add('hidden');
  }
}

function setModalBusy(sid, busy) {
  const row = modalBody.querySelector('.stars[data-sid="' + sid + '"]');
  if (row) row.classList.toggle('busy', busy);
}

// 拉取当前用户打分 overlay（一次，建 rateMap；浮窗已开则补星）
async function loadRateMap() {
  try {
    const r = await fetch('/api/rate/collections');
    if (r.status === 401 || !r.ok) return;
    const d = await r.json();
    rateMap = new Map();
    (d.items || []).forEach(it => rateMap.set(it.subject_id, {state: it.state, rate: it.rate}));
    if (modalOpenSid) {
      const row = modalBody.querySelector('.stars');
      if (row) decorateModalStars(row, modalOpenSid);
    }
  } catch (e) { /* overlay 失败降级空星，不影响页面 */ }
}

async function rate(sid, value) {
  setModalBusy(sid, true);
  try {
    const r = await fetch('/api/rate/' + sid, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({rate: value}),
    });
    if (r.status === 401) { await refreshAuth(); alert('登录已过期，请重新登录'); return; }
    if (!r.ok) { alert('评分失败（' + r.status + '），请重试'); return; }
    rateMap.set(sid, {state: '看过', rate: value});
    decorateModalStars(modalBody.querySelector('.stars'), sid);
  } catch (e) { alert('网络错误，请重试'); }
  finally { setModalBusy(sid, false); }
}

async function clearRate(sid) {
  setModalBusy(sid, true);
  try {
    const r = await fetch('/api/rate/' + sid, {method: 'DELETE'});
    if (r.status === 401) { await refreshAuth(); alert('登录已过期，请重新登录'); return; }
    if (!r.ok) { alert('清除失败（' + r.status + '），请重试'); return; }
    // BGM 无删除收藏接口：清除 = 评分归零、保留"看过"状态（对齐站内"删除评分"）
    const cur = rateMap.get(sid);
    rateMap.set(sid, {state: (cur && cur.state) || '看过', rate: 0});
    decorateModalStars(modalBody.querySelector('.stars'), sid);
  } catch (e) { alert('网络错误，请重试'); }
  finally { setModalBusy(sid, false); }
}

// 星形悬浮预览（不落库，mouseout 恢复 rateMap 值）
modalBody.addEventListener('mouseover', (e) => {
  const star = e.target.closest('.star');
  if (!star) return;
  const row = star.closest('.stars');
  fillStars(row, Number(star.dataset.v));
  setNum(row, star.dataset.v);
});
modalBody.addEventListener('mouseout', (e) => {
  const row = e.target.closest('.stars');
  if (!row) return;
  if (e.relatedTarget && row.contains(e.relatedTarget)) return;  // 仍在行内移动
  const sid = Number(row.dataset.sid);
  const cur = rateMap.get(sid);
  fillStars(row, cur ? cur.rate : 0);
  setNum(row, '');
});
// 点击：清除按钮 / 星（点当前分再点=清除）/ 相似项跳转
modalBody.addEventListener('click', e => {
  const clearBtn = e.target.closest('.clear-btn');
  if (clearBtn) { e.stopPropagation(); clearRate(Number(clearBtn.closest('.stars').dataset.sid)); return; }
  const star = e.target.closest('.star');
  if (star) {
    e.stopPropagation();
    const sid = Number(star.closest('.stars').dataset.sid);
    const v = Number(star.dataset.v);
    const cur = rateMap.get(sid);
    if (cur && cur.rate === v) { clearRate(sid); return; }  // 点击当前分再点 → 清除
    rate(sid, v);
    return;
  }
  const it = e.target.closest('.similar-item');
  if (it) openModal(Number(it.dataset.sid));
});
</script>
